     Netlify hosting facts for this site: static/SSR served via Netlify Edge. --><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 생활, 나의 선택</title>
<style>
:root{--ink:#173230;--green:#17765f;--pale:#e7f5eb;--cream:#fffaf1;--line:#d8e7df;--orange:#ee8b58;--purple:#826fd2}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}main{max-width:1080px;margin:auto;padding:34px 20px 60px}.eyebrow{margin:0 0 8px;color:var(--green);font-weight:800;font-size:14px}h1{font-size:clamp(34px,5vw,54px);letter-spacing:-.06em;line-height:1.1;margin:0}.intro{font-size:18px;color:#58716d;line-height:1.6}.notice{padding:18px 20px;background:var(--pale);border-radius:18px;display:flex;gap:12px;margin:24px 0}.notice span{font-size:25px}.notice strong{display:block;color:var(--ink)}.tabs{display:flex;gap:9px;overflow:auto}.tabs button{white-space:nowrap;border:1px solid var(--line);border-radius:16px 16px 0 0;background:#fff;padding:14px 20px;color:#58716d;font-weight:800;cursor:pointer}.tabs button b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#eaf0ec;font-size:13px;margin-right:7px}.tabs button.active{color:var(--ink);border-color:#91cdb0;border-bottom-color:#fff;box-shadow:0 -4px 0 #91d0b1}.tabs button.active b{background:var(--green);color:#fff}.game{background:#fff;border:1px solid var(--line);border-radius:0 24px 24px 24px;padding:30px;box-shadow:0 10px 28px #27614912}.heading{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid #e7eee9;padding-bottom:22px}.heading h2{font-size:30px;letter-spacing:-.04em;margin:4px 0 7px}.heading p{margin:0;color:#58716d}.count{align-self:center;background:#fff0e8;color:#874520;border-radius:15px;min-width:92px;text-align:center;padding:10px}.count strong{font-size:27px}.count small{display:block;font-size:12px}.scene{display:grid;grid-template-columns:330px 1fr;background:#f5faf6;border-radius:20px;overflow:hidden;margin:26px 0}.scene img{width:100%;height:225px;object-fit:cover}.scene div{padding:27px}.scene b{font-size:14px;color:var(--green)}.scene h3{font-size:24px;margin:8px 0;letter-spacing:-.04em}.scene p{color:#58716d;margin:0}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.choice{min-height:125px;border:2px solid #e0ebe4;border-radius:18px;background:#fff;color:var(--ink);font-weight:800;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px}.choice:hover:not(:disabled){border-color:#86c9ad;transform:translateY(-2px)}.choice:disabled{opacity:.45}.choice.selected{background:#eaf8ef;border-color:var(--green);box-shadow:inset 0 0 0 2px #c8edd8}.choice em{font-style:normal;font-size:37px}.choice small{height:14px;color:var(--green)}.actions{border-top:1px solid #e7eee9;margin-top:28px;padding-top:19px;display:flex;justify-content:space-between;align-items:center;gap:16px;color:#58716d}.actions button{border:0;border-radius:14px;background:var(--green);color:#fff;padding:14px 20px;font-weight:800;cursor:pointer}.actions button:disabled{opacity:.45}.result{display:none;margin-top:30px;border:1px solid #efdcae;background:#fff8e8;border-radius:22px;padding:25px}.result.show{display:block}.result h3{margin:4px 0 18px;font-size:23px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border-radius:16px;padding:17px;border-top:5px solid var(--green)}.card.friend{border-color:var(--purple)}.result-item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #edf0ed}.result-item em{font-style:normal;font-size:26px}.result-item strong,.result-item small{display:block}.result-item small{color:#58716d;margin-top:3px}.talk{background:#eaf4ff;border-radius:14px;margin-top:16px;padding:15px;line-height:1.5}@media(max-width:700px){main{padding:26px 14px}.game{padding:20px;border-radius:0}.heading h2{font-size:25px}.scene{grid-template-columns:1fr}.scene img{height:190px}.scene div{padding:20px}.choices{grid-template-columns:repeat(2,1fr);gap:10px}.choice{min-height:108px;font-size:15px}.actions{display:block}.actions button{width:100%;margin-top:14px}.compare{grid-template-columns:1fr}}
</style></head><body><main>
<p class="eyebrow">선택 연습 게임</p><h1>나의 생활, 나의 선택</h1><p class="intro">생활에 필요한 것을 직접 고르고, 친구의 선택과 비교해 보세요.</p><div class="notice"><span>💬</span><div><strong>사람마다 필요한 것이 달라요.</strong>그래서 선택도 서로 다를 수 있어요.</div></div>
<nav class="tabs" id="tabs"></nav><section class="game" id="game"></section>
</main><script>
const activities=[
{tab:'새집 물건',title:'새집에 먼저 필요한 것을 골라요',limit:3,img:'assets/new-home.png',question:'나는 새집에 무엇이 먼저 필요할까요?',desc:'가장 먼저 필요한 물건을 세 개까지 골라 보세요.',friend:['sofa','mirror','clock'],choices:[['desk','🪑','책상','글을 쓰거나 서류를 정리할 수 있어요.'],['sofa','🛋️','소파','편하게 쉬거나 손님을 맞이할 수 있어요.'],['mirror','🪞','전신 거울','외출하기 전에 옷차림을 살필 수 있어요.'],['clock','🕒','벽시계','시간을 확인하고 약속을 지킬 수 있어요.'],['bed','🛏️','침대','편안히 쉬고 잠을 잘 수 있어요.'],['storage','🗄️','수납장','옷과 생활용품을 정리할 수 있어요.'],['table','🍽️','식탁','식사하거나 간단한 일을 할 수 있어요.'],['micro','♨️','전자레인지','간단한 음식을 데울 수 있어요.']]},
{tab:'건강한 생활',title:'내가 실천할 건강한 습관을 골라요',limit:2,img:'assets/healthy-habits.png',question:'나는 내 몸을 위해 무엇을 해 볼까요?',desc:'이번 주에 실천해 보고 싶은 습관을 두 개까지 골라 보세요.',friend:['walk','sleep'],choices:[['walk','🚶','20분 걷기','가볍게 몸을 움직일 수 있어요.'],['jump','🪢','줄넘기하기','내가 좋아하는 운동을 할 수 있어요.'],['sleep','🌙','일찍 잠자리 들기','다음 날을 더 개운하게 시작할 수 있어요.'],['late','🍜','늦은 시간에는 먹지 않기','내 몸에 맞는 저녁 시간을 정할 수 있어요.'],['water','💧','물 자주 마시기','하루 동안 물을 챙겨 마실 수 있어요.'],['cook','🥗','간단한 식사 만들기','내가 먹을 음식을 직접 준비할 수 있어요.'],['drink','🥂','술 마시는 날 줄이기','내 생활에 맞는 건강 계획을 세울 수 있어요.'],['check','🩺','건강검진 일정 확인하기','내 몸을 살피는 약속을 정할 수 있어요.']]},
{tab:'배울 기술',title:'활동지원사와 배울 기술을 골라요',limit:2,img:'assets/life-skills.png',question:'나는 어떤 생활기술을 먼저 배울까요?',desc:'먼저 배우고 싶은 생활기술을 두 개까지 골라 보세요.',friend:['laundry','bank'],choices:[['laundry','🧺','세탁기 돌리기','내 옷을 깨끗하게 관리할 수 있어요.'],['micro','🍲','전자레인지 사용하기','간단한 식사를 안전하게 준비할 수 있어요.'],['hygiene','🧤','주방 위생 관리','음식을 만드는 곳을 깨끗하게 관리할 수 있어요.'],['trash','♻️','쓰레기 분리배출','살고 있는 곳을 깨끗하게 유지할 수 있어요.'],['bank','🏦','은행 업무 보기','내 돈과 필요한 일을 직접 관리할 수 있어요.'],['bus','🚌','버스 타기','내가 가고 싶은 곳으로 이동할 수 있어요.'],['hospital','📅','병원 예약하기','필요한 진료 약속을 정할 수 있어요.'],['shop','🛒','장보기 계획하기','필요한 물건을 골라 살 수 있어요.']]}
];let active=0;const picks=[[],[],[]];const tabs=document.querySelector('#tabs'),game=document.querySelector('#game');
function render(){const a=activities[active];tabs.innerHTML=activities.map((item,i)=>`<button class="${i===active?'active':''}" onclick="changeTab(${i})"><b>${i+1}</b>${item.tab}</button>`).join('');const mine=picks[active];game.innerHTML=`<div class="heading"><div><p>활동 ${active+1}</p><h2>${a.title}</h2><p>${a.desc}</p></div><div class="count"><strong>${mine.length}</strong> / ${a.limit}<small>개 고르기</small></div></div><div class="scene"><img src="${a.img}" alt="${a.tab} 선택 활동"><div><b>먼저 생각해 보기</b><h3>${a.question}</h3><p>그림을 눌러 선택해 보세요.</p></div></div><div class="choices">${a.choices.map(c=>`<button class="choice ${mine.includes(c[0])?'selected':''}" ${!mine.includes(c[0])&&mine.length>=a.limit?'disabled':''} onclick="choose('${c[0]}')"><em>${c[1]}</em>${c[2]}<small>${mine.includes(c[0])?'선택함':''}</small></button>`).join('')}</div><div class="actions"><span>${mine.length?mine.length+'개를 골랐어요. 선택한 이유도 생각해 보세요.':'그림을 눌러 선택해 보세요.'}</span><button ${mine.length?'':'disabled'} onclick="showResult()">내 결과 보기 →</button></div><section class="result" id="result"></section>`}
function changeTab(i){active=i;render()}function choose(id){const m=picks[active];const p=m.indexOf(id);if(p>=0)m.splice(p,1);else if(m.length<activities[active].limit)m.push(id);render()}function item(id){return activities[active].choices.find(c=>c[0]===id)}function rows(list){return list.map(id=>{const c=item(id);return `<div class="result-item"><em>${c[1]}</em><span><strong>${c[2]}</strong><small>${c[3]}</small></span></div>`}).join('')}function showResult(){const a=activities[active],box=document.querySelector('#result');box.classList.add('show');box.innerHTML=`<p class="eyebrow">✨ 선택 결과</p><h3>나의 선택과 친구의 선택을 비교해 봐요</h3><div class="compare"><div class="card"><strong>나의 선택</strong>${rows(picks[active])}</div><div class="card friend"><strong>친구의 선택</strong>${rows(a.friend)}</div></div><div class="talk"><strong>💡 이야기해 볼까요?</strong><br>나는 왜 이것을 골랐나요? 친구와 같은 점, 다른 점은 무엇인가요?</div>`;box.scrollIntoView({behavior:'smooth',block:'nearest'})}render();
</script></body></html>
