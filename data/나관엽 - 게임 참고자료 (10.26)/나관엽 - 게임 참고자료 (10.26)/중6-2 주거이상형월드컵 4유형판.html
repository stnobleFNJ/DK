<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>나의 주거유형 이상형월드컵</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #d8dde3;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    height: 100%;
    overflow: hidden;
  }
  #app-outer {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    padding: 12px;
  }
  #phone {
    width: 100%;
    max-width: 420px;
    height: 100%;
    max-height: 800px;
    background: #fff;
    border-radius: 30px;
    border: 8px solid #1c1c1e;
    overflow: hidden;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
  }
  .screen { flex: 1; display: none; flex-direction: column; overflow: hidden; }
  .screen.active { display: flex; }

  #screen-start {
    justify-content: center; align-items: center; padding: 26px; text-align: center;
    background: linear-gradient(180deg,#fff0e0,#ffffff);
  }
  #screen-start h1 { font-size: 21px; margin-bottom: 8px; }
  #screen-start p { font-size: 13px; color: #777; margin-bottom: 26px; line-height: 1.6; }
  #screen-start button {
    padding: 16px 34px; border-radius: 26px; border: none;
    background: #ff9f43; color: #fff; font-size: 16px; font-weight: bold;
  }

  #screen-vs { background: #fff; }
  .vs-progress { padding: 10px 16px 4px; text-align: center; font-size: 12px; color: #888; flex-shrink: 0; }
  .vs-bar-outer { height: 6px; background: #eee; border-radius: 4px; margin: 4px 16px 10px; overflow: hidden; flex-shrink: 0; }
  .vs-bar-inner { height: 100%; background: #ff9f43; width: 0%; transition: width 0.3s; }

  .scoreboard { padding: 4px 16px 4px; flex-shrink: 0; }
  .score-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 10px; }
  .score-row .score-label { width: 70px; flex-shrink: 0; color: #555; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .score-row .score-bar-outer { flex: 1; height: 10px; background: #eee; border-radius: 6px; overflow: hidden; }
  .score-row .score-bar-inner { height: 100%; width: 0%; border-radius: 6px; transition: width 0.3s; }
  .score-row .score-num { width: 16px; text-align: right; color: #999; flex-shrink: 0; }
  .bar-I { background: #6bd0a3; }
  .bar-G { background: #6ba8ff; }
  .bar-F { background: #b58bff; }
  .bar-D { background: #ff8bab; }

  .vs-title { text-align: center; font-size: 12px; color: #999; margin: 6px 0; flex-shrink: 0; }
  .vs-cards { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 0 16px 12px; }
  .vs-card {
    flex: 1; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 12px; text-align: center; cursor: pointer; color: #fff; transition: transform 0.15s;
  }
  .vs-card:active { transform: scale(0.97); }
  .vs-card .emoji { font-size: 38px; margin-bottom: 6px; }
  .vs-card .txt { font-size: 14px; font-weight: bold; line-height: 1.35; }
  .vs-card.a { background: linear-gradient(135deg,#4c8dff,#6fb1ff); }
  .vs-card.b { background: linear-gradient(135deg,#ff5c5c,#ff8b8b); }
  .vs-divider { text-align: center; font-size: 13px; font-weight: bold; color: #bbb; }

  #screen-result { justify-content: center; align-items: center; padding: 26px; text-align: center; background: linear-gradient(180deg,#fff7e0,#ffffff); }
  #screen-result .crown { font-size: 40px; margin-bottom: 6px; }
  #screen-result .label { font-size: 13px; color: #999; margin-bottom: 4px; }
  #screen-result .result-emoji { font-size: 64px; margin-bottom: 8px; }
  #screen-result h2 { font-size: 22px; margin-bottom: 8px; }
  #screen-result p.desc { font-size: 13px; color: #777; margin-bottom: 24px; line-height: 1.6; }
  #screen-result button { padding: 13px 28px; border-radius: 24px; border: none; background: #4c8dff; color: #fff; font-weight: bold; font-size: 14px; }
</style>
</head>
<body>

<div id="app-outer">
  <div id="phone">

    <div class="screen active" id="screen-start">
      <h1>🏆 나의 주거유형<br>이상형월드컵</h1>
      <p>자립홈 · 공동생활가정 · 거주시설 · 독립생활<br>둘 중 더 마음에 드는 모습을 골라보세요.<br>모두 12문제예요.</p>
      <button onclick="startGame()">시작하기</button>
    </div>

    <div class="screen" id="screen-vs">
      <div class="vs-progress" id="vs-progress">1 / 12</div>
      <div class="vs-bar-outer"><div class="vs-bar-inner" id="vs-bar"></div></div>
      <div class="scoreboard" id="scoreboard">
        <div class="score-row"><span class="score-label">🏘️ 자립홈</span><div class="score-bar-outer"><div class="score-bar-inner bar-I" id="bar-I"></div></div><span class="score-num" id="num-I">0</span></div>
        <div class="score-row"><span class="score-label">👥 그룹홈</span><div class="score-bar-outer"><div class="score-bar-inner bar-G" id="bar-G"></div></div><span class="score-num" id="num-G">0</span></div>
        <div class="score-row"><span class="score-label">🏢 거주시설</span><div class="score-bar-outer"><div class="score-bar-inner bar-F" id="bar-F"></div></div><span class="score-num" id="num-F">0</span></div>
        <div class="score-row"><span class="score-label">🔑 독립생활</span><div class="score-bar-outer"><div class="score-bar-inner bar-D" id="bar-D"></div></div><span class="score-num" id="num-D">0</span></div>
      </div>
      <div class="vs-title">더 마음에 드는 쪽을 골라주세요</div>
      <div class="vs-cards">
        <div class="vs-card a" id="card-a" onclick="pick('a')">
          <div class="emoji" id="emoji-a"></div>
          <div class="txt" id="txt-a"></div>
        </div>
        <div class="vs-divider">VS</div>
        <div class="vs-card b" id="card-b" onclick="pick('b')">
          <div class="emoji" id="emoji-b"></div>
          <div class="txt" id="txt-b"></div>
        </div>
      </div>
    </div>

    <div class="screen" id="screen-result">
      <div class="crown">👑</div>
      <div class="label">나에게 어울리는 주거유형은</div>
      <div class="result-emoji" id="result-emoji">🏘️</div>
      <h2 id="result-name">자립홈</h2>
      <p class="desc" id="result-desc"></p>
      <button onclick="resetGame()">다시 하기</button>
    </div>

  </div>
</div>

<script>
  const types = {
    I: {name:"자립홈", emoji:"🏘️", desc:"담당자와 따로 살면서, 필요할 때만 도움을 받아요."},
    G: {name:"공동생활가정 (그룹홈)", emoji:"👥", desc:"4~6명이 담당자와 함께 살며 서로 도와요."},
    F: {name:"거주시설", emoji:"🏢", desc:"많은 사람들과 함께, 24시간 도와주는 사람과 살아요."},
    D: {name:"독립생활", emoji:"🔑", desc:"혼자, 스스로의 힘으로 살아요."}
  };

  // 4유형 라운드로빈: I-G, I-F, I-D, G-F, G-D, F-D 를 각각 2문항씩 = 12문항
  const questions = [
    { a:{type:"I", emoji:"🔔", txt:"필요할 때만 도움 요청하기"}, b:{type:"G", emoji:"🧑‍🏫", txt:"선생님과 함께 살기"} },
    { a:{type:"I", emoji:"🚪", txt:"내 방 쓰고 공용공간만 같이"}, b:{type:"G", emoji:"🛏️", txt:"4~6명과 방까지 같이"} },

    { a:{type:"I", emoji:"🧑‍🤝‍🧑", txt:"소수의 사람과 살기"}, b:{type:"F", emoji:"🏢", txt:"30명 이상과 함께 살기"} },
    { a:{type:"I", emoji:"🔔", txt:"필요할 때만 도움받기"}, b:{type:"F", emoji:"🤝", txt:"24시간 도움받기"} },

    { a:{type:"I", emoji:"🧑‍🤝‍🧑", txt:"다른 사람과 함께 살기"}, b:{type:"D", emoji:"🧍", txt:"혼자 살기"} },
    { a:{type:"I", emoji:"🔔", txt:"필요하면 도움 요청하기"}, b:{type:"D", emoji:"💪", txt:"모든 걸 스스로 하기"} },

    { a:{type:"G", emoji:"👨‍👩‍👧‍👦", txt:"4~6명과 살기"}, b:{type:"F", emoji:"🏢", txt:"30명 이상과 살기"} },
    { a:{type:"G", emoji:"🍳", txt:"직접 요리해서 먹기"}, b:{type:"F", emoji:"🍽️", txt:"식당에서 다같이 식사하기"} },

    { a:{type:"G", emoji:"🧑‍🏫", txt:"선생님과 함께 살기"}, b:{type:"D", emoji:"🧍", txt:"혼자, 선생님 없이 살기"} },
    { a:{type:"G", emoji:"🧑‍🤝‍🧑", txt:"여러 사람과 함께 살기"}, b:{type:"D", emoji:"🔑", txt:"혼자 살기"} },

    { a:{type:"F", emoji:"🤝", txt:"24시간 도움받기"}, b:{type:"D", emoji:"💪", txt:"스스로 다 하기"} },
    { a:{type:"F", emoji:"👨‍👩‍👧‍👦", txt:"많은 사람과 함께 살기"}, b:{type:"D", emoji:"🧍", txt:"혼자 살기"} }
  ];

  let order = [];
  let round = 0;
  const scores = { I:0, G:0, F:0, D:0 };

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function updateScoreboard() {
    const maxScore = Math.max(1, ...Object.values(scores));
    Object.keys(scores).forEach(k => {
      const pct = (scores[k] / maxScore) * 100;
      document.getElementById('bar-' + k).style.width = pct + '%';
      document.getElementById('num-' + k).textContent = scores[k];
    });
  }

  function startGame() {
    order = shuffle(questions);
    round = 0;
    Object.keys(scores).forEach(k => scores[k] = 0);
    updateScoreboard();
    showScreen('screen-vs');
    renderRound();
  }

  function renderRound() {
    const q = order[round];
    document.getElementById('vs-progress').textContent = (round + 1) + ' / ' + order.length;
    document.getElementById('vs-bar').style.width = (100 * round / order.length) + '%';
    document.getElementById('emoji-a').textContent = q.a.emoji;
    document.getElementById('txt-a').textContent = q.a.txt;
    document.getElementById('emoji-b').textContent = q.b.emoji;
    document.getElementById('txt-b').textContent = q.b.txt;
  }

  function pick(side) {
    const q = order[round];
    const chosen = side === 'a' ? q.a : q.b;
    scores[chosen.type]++;
    updateScoreboard();
    round++;
    if (round >= order.length) {
      showResult();
    } else {
      renderRound();
    }
  }

  function showResult() {
    let best = 'I';
    Object.keys(scores).forEach(k => { if (scores[k] > scores[best]) best = k; });
    const t = types[best];
    document.getElementById('result-emoji').textContent = t.emoji;
    document.getElementById('result-name').textContent = t.name;
    document.getElementById('result-desc').textContent = t.desc;
    showScreen('screen-result');
  }

  function resetGame() {
    showScreen('screen-start');
  }
</script>

</body>
</html>
