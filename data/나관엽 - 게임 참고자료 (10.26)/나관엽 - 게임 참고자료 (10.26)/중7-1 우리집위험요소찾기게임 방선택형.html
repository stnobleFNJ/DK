<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>우리집 위험 요소를 찾아줘!</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #d8dde3;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    height: 100%;
    overflow: hidden;
  }
  #app-outer {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    padding: 12px;
  }
  #phone {
    width: 100%;
    max-width: 420px;
    height: 100%;
    max-height: 820px;
    background: #fff;
    border-radius: 30px;
    border: 8px solid #1c1c1e;
    overflow: hidden;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
  }
  .screen { flex: 1; display: none; flex-direction: column; overflow: hidden; }
  .screen.active { display: flex; }

  /* 방 선택 화면 */
  #screen-select {
    justify-content: center;
    padding: 20px;
    text-align: center;
    background: linear-gradient(180deg,#eef3ff,#ffffff);
  }
  #screen-select h1 { font-size: 20px; margin: 6px 0 16px; }
  .room-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .room-btn {
    border: none;
    border-radius: 18px;
    padding: 22px 8px;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    position: relative;
  }
  .room-btn .emoji { font-size: 34px; }
  .room-btn.living { background: linear-gradient(135deg,#ff9f43,#ffbb70); }
  .room-btn.kitchen { background: linear-gradient(135deg,#ff5c5c,#ff8b8b); }
  .room-btn.bath { background: linear-gradient(135deg,#4c8dff,#6fb1ff); }
  .room-btn.entrance { background: linear-gradient(135deg,#6bd0a3,#8fe0bc); }
  .room-btn .done-badge {
    position: absolute;
    top: 8px; right: 10px;
    font-size: 16px;
  }

  /* 방 화면 */
  #screen-room { background: #000; position: relative; }
  .room-header {
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    border-bottom: 1px solid #eee;
    flex-shrink: 0;
  }
  .room-header .back { font-size: 20px; cursor: pointer; }
  .room-header .title { font-size: 15px; font-weight: bold; }
  .room-header .count { font-size: 12px; color: #888; }

  .room-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    overflow: hidden;
    padding: 8px;
  }
  .room-scene {
    position: relative;
    width: 100%;
    max-height: 100%;
    aspect-ratio: 4/3;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
  }
  .room-scene img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #000;
  }
  .hotspot {
    position: absolute;
    width: 11%;
    aspect-ratio: 1/1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: transparent;
    border: none;
    cursor: pointer;
    z-index: 5;
  }
  .hotspot.found {
    background: rgba(46,204,113,0.3);
    border: 3px solid #2ecc71;
  }
  .hotspot.found::after { content: "✅"; font-size: 24px; }
  .hotspot.found {
    display: flex; align-items: center; justify-content: center;
  }

  .clear-toast {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%,-50%);
    background: rgba(0,0,0,0.82);
    color: #fff;
    padding: 20px 30px;
    border-radius: 18px;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    display: none;
    z-index: 20;
  }
  .clear-toast.show { display: block; }

  .found-toast {
    position: absolute;
    left: 50%; bottom: 16px;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 8px 16px;
    border-radius: 18px;
    font-size: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    max-width: 88%;
    text-align: center;
    z-index: 15;
  }
  .found-toast.show { opacity: 1; }

  /* 최종 완료 화면 */
  #screen-finish {
    justify-content: center;
    align-items: center;
    padding: 26px;
    text-align: center;
    background: linear-gradient(180deg,#fff7e0,#ffffff);
  }
  #screen-finish .big { font-size: 56px; margin-bottom: 12px; }
  #screen-finish h2 { font-size: 22px; margin-bottom: 8px; line-height: 1.4; }
  #screen-finish p { font-size: 13px; color: #777; margin-bottom: 22px; }
  #screen-finish button {
    padding: 13px 28px;
    border-radius: 24px;
    border: none;
    background: #4c8dff;
    color: #fff;
    font-weight: bold;
    font-size: 14px;
  }
</style>
</head>
<body>

<div id="app-outer">
  <div id="phone">

    <!-- 방 선택 화면 -->
    <div class="screen active" id="screen-select">
      <h1>🏠 우리집 위험 요소를<br>찾아줘!</h1>
      <div class="room-grid">
        <button class="room-btn living" onclick="openRoom('living')">
          <span class="emoji">🛋️</span> 거실
          <span class="done-badge" id="done-living"></span>
        </button>
        <button class="room-btn kitchen" onclick="openRoom('kitchen')">
          <span class="emoji">🍳</span> 주방
          <span class="done-badge" id="done-kitchen"></span>
        </button>
        <button class="room-btn bath" onclick="openRoom('bath')">
          <span class="emoji">🛁</span> 화장실
          <span class="done-badge" id="done-bath"></span>
        </button>
        <button class="room-btn entrance" onclick="openRoom('entrance')">
          <span class="emoji">🚪</span> 현관
          <span class="done-badge" id="done-entrance"></span>
        </button>
      </div>
    </div>

    <!-- 방 화면 -->
    <div class="screen" id="screen-room">
      <div class="room-header">
        <span class="back" onclick="backToSelect()">⬅️</span>
        <span class="title" id="room-title">방 이름</span>
        <span class="count" id="room-count">0 / 0</span>
      </div>
      <div class="room-body">
        <div class="room-scene" id="room-scene">
          <img id="room-img" src="" alt="room">
        </div>
      </div>
      <div class="clear-toast" id="clear-toast">🎉<br>다 찾았어요!</div>
      <div class="found-toast" id="found-toast">안전해졌어요!</div>
    </div>

    <!-- 최종 완료 화면 -->
    <div class="screen" id="screen-finish">
      <div class="big">🛡️</div>
      <h2>내가 우리집<br>안전관리사!</h2>
      <p>네 곳의 위험 요소를 모두 찾았어요.</p>
      <button onclick="resetAll()">처음으로</button>
    </div>

  </div>
</div>

      hazards: [
        { left: 24, top: 46, label: "현관문이 잠기지 않고 열려있어요 (문단속 위험)" },
        { left: 74, top: 83, label: "문어발 콘센트예요 (전기 화재 위험)" }
      ]
    }
  };

  const progress = { living: false, kitchen: false, bath: false, entrance: false };
  let currentRoom = null;
  let remaining = 0;

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function openRoom(key) {
    currentRoom = key;
    const room = rooms[key];
    document.getElementById('room-title').textContent = room.name;
    document.getElementById('room-img').src = room.img;
    document.getElementById('room-scene').style.aspectRatio = (key === 'kitchen') ? '1 / 1' : '4 / 3';
    document.getElementById('clear-toast').classList.remove('show');

    const scene = document.getElementById('room-scene');
    scene.querySelectorAll('.hotspot').forEach(el => el.remove());

    remaining = room.hazards.length;
    document.getElementById('room-count').textContent = '0 / ' + remaining;

    room.hazards.forEach((h) => {
      const el = document.createElement('div');
      el.className = 'hotspot';
      el.style.left = h.left + '%';
      el.style.top = h.top + '%';
      el.onclick = () => fixHazard(el, h);
      scene.appendChild(el);
    });

    showScreen('screen-room');
  }

  function fixHazard(el, h) {
    if (el.classList.contains('found')) return;
    el.classList.add('found');
    remaining--;
    const room = rooms[currentRoom];
    document.getElementById('room-count').textContent = (room.hazards.length - remaining) + ' / ' + room.hazards.length;

    const toast = document.getElementById('found-toast');
    toast.textContent = '안전해졌어요! (' + h.label + ')';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1300);

    if (remaining === 0) {
      progress[currentRoom] = true;
      document.getElementById('done-' + currentRoom).textContent = '✅';
      setTimeout(() => {
        document.getElementById('clear-toast').classList.add('show');
        setTimeout(() => {
          document.getElementById('clear-toast').classList.remove('show');
          if (progress.living && progress.kitchen && progress.bath && progress.entrance) {
            showScreen('screen-finish');
          } else {
            showScreen('screen-select');
          }
        }, 3000);
      }, 400);
    }
  }

  function backToSelect() {
    showScreen('screen-select');
  }

  function resetAll() {
    Object.keys(progress).forEach(k => {
      progress[k] = false;
      document.getElementById('done-' + k).textContent = '';
    });
    showScreen('screen-select');
  }
</script>
