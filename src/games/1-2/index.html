<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>다른 사람의 한 주 살펴보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=Gowun+Batang:wght@400;700&family=Gaegu:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/paper.css">
<style>
/* 질문마다 사진 1장 + 날짜 보기 3개 중 고르기 */
.qp{position:relative;margin:14px 6px 0}
.qp .cp{aspect-ratio:auto}
.qp .cp img{height:auto;max-height:54vh;object-fit:contain;background:#9ccfe6}
.zm{position:absolute;right:-6px;bottom:-8px;z-index:4;width:44px;height:44px;border-radius:50%;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.opts.dates{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px}
.opts.dates .opt{flex-direction:column;align-items:center;text-align:center;gap:6px;padding:12px 6px;font:var(--hw) 22px/1.15 var(--fh)}
.done .opt:not(.ok){opacity:.4}
.qn{display:inline-block;margin:16px 0 0;padding:2px 10px;border-radius:999px;background:var(--tape);font:700 13px var(--fb)}
.week{list-style:none;margin:0;padding:0}
.week li{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.week li:last-child{border:0}
.week b{flex:none;min-width:86px;font:var(--hw) 22px var(--fh);color:var(--ac)}
dialog.zoom{width:min(980px,calc(100% - 16px));max-width:none;padding:10px 10px 12px;border-radius:14px}
dialog.zoom img{width:100%;border-radius:8px}
dialog.zoom button{margin-top:10px}
</style>
</head>
<body>
<div class="stage"><main class="app" id="app"></main></div>
<dialog id="help" aria-labelledby="ht"><h2 id="ht">이렇게 해요!</h2><ol><li>질문을 잘 읽어요.</li><li>사진을 잘 살펴봐요. 🔍를 누르면 크게 볼 수 있어요.</li><li>보기 3개 중에서 알맞은 날짜를 눌러요.</li></ol><p>틀려도 괜찮아요. 사진을 다시 보고 또 해 보세요.</p><button onclick="this.closest('dialog').close()">알겠어요</button></dialog>
<dialog id="zoom" class="zoom" aria-label="사진 크게 보기"><img id="zimg" alt=""><button onclick="this.closest('dialog').close()">닫기</button></dialog>
<script src="../common/game.js"></script>
<script>
const BRAND={mark:'주',html:'다른 사람의 <b>한 주</b>'};
const PH=[
  {n:'대화 내용',img:'img/chat.jpg',alt:'영미와 나눈 대화. 5월 18일 (월요일). 함께 찍은 사진을 보냈어요.'},
  {n:'영수증',img:'img/receipt.jpg',alt:'생애중화요리 영수증. 2026-05-21 13:25. 탕수육 1, 짬뽕 2, 합계 44,000원'},
  {n:'영화 입장권',img:'img/ticket.jpg',alt:'영화 입장권. 말아톤. 2026-05-23 (토) 19:30 ~ 22:00'}
];
// 11/18 수정 요청(오승은): 질문마다 그 사진 한 장만 보여 주고, 보기 3개 중에서 고른다.
// 정답은 사진에 적힌 날짜 — 대화 5월 18일(월요일), 영수증 2026-05-21(목), 입장권 2026-05-23(토).
const Q=[
  {q:'영미를 만난 날은 언제인가요?',ph:0,opts:['5/18(월)','5/19(화)','5/21(목)'],ans:0,ok:'대화 맨 위에 “5월 18일 (월요일)”이라고 쓰여 있어요.',hint:'대화 맨 위에 날짜가 있어요.',did:'영미를 만났어요.'},
  {q:'생애중화요리에서 식사를 한 날은 언제인가요?',ph:1,opts:['5/18(월)','5/21(목)','5/23(토)'],ans:1,ok:'영수증 가게 이름 아래에 “2026-05-21”이라고 쓰여 있어요.',hint:'영수증 가게 이름 아래에 날짜가 있어요.',did:'생애중화요리에서 식사했어요.'},
  {q:'영화를 본 날은 언제인가요?',ph:2,opts:['5/19(화)','5/21(목)','5/23(토)'],ans:2,ok:'영화 입장권에 “2026-05-23 (토)”라고 쓰여 있어요.',hint:'영화 제목 「말아톤」 아래에 날짜가 있어요.',did:'영화 「말아톤」을 봤어요.'}
];
const DAY={'월':'월요일','화':'화요일','수':'수요일','목':'목요일','금':'금요일','토':'토요일','일':'일요일'};
const read=d=>d.replace(/(\d+)\/(\d+)\((.)\)/,(_,m,dd,w)=>`${m}월 ${dd}일 ${DAY[w]}`);
const show=d=>d.replace('(',' (');

const root=document.getElementById('app');
let timers=[],busy=false;
const clear=()=>{timers.forEach(clearTimeout);timers=[];busy=false;try{speechSynthesis.cancel()}catch(e){}};
const later=(f,ms)=>timers.push(setTimeout(f,ms));
const $=s=>root.querySelector(s);
function zoom(i){const z=document.getElementById('zoom'),im=document.getElementById('zimg');im.src=PH[i].img;im.alt=PH[i].alt;z.showModal()}

function home(){
  clear();
  DK.mount(root,`${DK.hbar(BRAND)}
  <section class="hero"><span class="eb">Look at a week</span><h1 class="h1">다른 사람의 한 주를<br><em>살펴봐요!</em></h1><p>대화, 영수증, 영화 입장권 사진이 하나씩 나와요. 사진에서 날짜를 찾아 알맞은 보기를 골라 보세요.</p></section>
  <div class="picks two">${PH.slice(0,2).map((p,i)=>`<div class="photo pick"><i class="tp"></i><span class="cp"><img src="${p.img}" alt="${p.alt}"></span><span class="ct">${p.n}</span></div>`).join('')}</div>
  <div class="photo tilt-r" style="margin:18px 40px 0"><i class="tp"></i><span class="cp"><img src="${PH[2].img}" alt="${PH[2].alt}"></span><span class="ct">${PH[2].n}<small>질문 3개를 풀어요</small></span></div>
  <div class="acts"><button class="btn pri" data-act="start">시작하기</button><button class="btn sec" data-say="다른 사람의 한 주를 살펴봐요. 사진에서 날짜를 찾아 알맞은 보기를 골라 보세요.">🔊 듣기</button></div>${DK.DKU}`,{start:()=>quiz(0)});
}

function quiz(i){
  clear();
  const s=Q[i],p=PH[s.ph];
  DK.mount(root,`${DK.hbar(BRAND,true)}
  ${DK.seg(3,i)}
  <span class="qn">질문 ${i+1}</span>
  <p class="saybig" style="margin-top:8px"><span>${s.q}</span><button class="spk" data-say="${s.q}" aria-label="질문 듣기">${DK.SPK}</button></p>
  <div class="photo qp tilt-l"><i class="tp"></i><span class="cp"><img src="${p.img}" alt="${p.alt}"></span><span class="ct">${p.n}</span><button class="zm" data-act="zoom" data-k="${s.ph}" aria-label="${p.n} 크게 보기">🔍</button></div>
  <p class="qs" style="margin-top:14px">사진에서 날짜를 찾아 <b>보기 3개</b> 중에서 골라요.</p>
  <div class="opts dates" id="m">${s.opts.map((d,k)=>`<button class="opt" data-act="dt" data-k="${k}" aria-label="${read(d)}"><span class="no">${k+1}</span><span>${show(d)}</span></button>`).join('')}</div>
  <div id="fb" aria-live="polite"></div>
  <div class="acts" id="nx" hidden><button class="btn pri" data-act="next">${i<2?'다음 질문 ›':'결과 보기 ›'}</button></div>${DK.DKU}`,{
    home,zoom:b=>zoom(+b.dataset.k),next:()=>i<2?quiz(i+1):result(),
    dt:b=>{if(busy)return;check(i,+b.dataset.k,b)}
  });
  later(()=>DK.speak(s.q),300);
}

function check(i,k,b){
  const s=Q[i],fb=$('#fb');
  root.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o===b));
  if(k===s.ans){
    busy=true;b.classList.add('ok');$('#m').classList.add('done');
    fb.innerHTML=`<p class="fb ok"><span>⭕</span><span>맞아요! ${show(s.opts[s.ans])}<small>${s.ok}</small></span></p>`;
    $('#nx').hidden=false;DK.speak('맞아요! '+read(s.opts[s.ans])+'. '+s.ok);
    $('#nx').scrollIntoView({behavior:'smooth',block:'nearest'});
    return;
  }
  busy=true;b.classList.add('wrong');
  fb.innerHTML=`<p class="fb no"><span>🙂</span><span>괜찮아요, 다시 해 봐요!<small>${s.hint}</small></span></p>`;
  DK.speak('괜찮아요, 다시 해 봐요! '+s.hint);
  later(()=>{busy=false;b.classList.remove('wrong','on')},1400);
}

function result(){
  clear();
  const say='모든 날짜를 찾았어요! 한 주를 잘 살펴봤어요.';
  DK.mount(root,`${DK.hbar(BRAND,true)}
  <div class="win"><span class="stamp">참<br>잘했어요</span><span class="wp"><img src="${PH[0].img}" alt="${PH[0].alt}"></span><div class="wc"><h2>한 주를 잘 살펴봤어요!</h2><p>사진 속 날짜를 모두 찾았어요.</p></div></div>
  ${DK.sayBig(say)}
  <div class="note"><h3>📅 이번 주에 한 일</h3><ul class="week">${Q.map(s=>`<li><b>${show(s.opts[s.ans])}</b><span>${s.did}</span></li>`).join('')}</ul></div>
  <div class="acts two"><button class="btn sec" data-act="again">↻ 다시 풀기</button><button class="btn pri" data-act="home">처음으로</button></div>${DK.DKU}`,{home,again:()=>quiz(0)});
  DK.done();
  DK.speak(say);
}

home();
</script>
</body>
</html>
