<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내 프로그램 내 손으로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=Gowun+Batang:wght@400;700&family=Gaegu:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/paper.css">
<style>
/* 11/18 수정 의견(오승은) · 4회기 게임샷: 요일 → 오전/오후 → 프로그램 카드(사진 미리 보기) → 저장 → 다음 주 표 */
.stp{display:inline-block;margin:6px 0 0;font:700 12px var(--fb);letter-spacing:.14em;color:var(--ac)}
/* 요일·시간 카드 */
.days{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.day{position:relative;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px 14px;box-shadow:2px 2px 0 var(--line);transition:border-color .15s,background .15s}
.day small{display:block;font:700 11px var(--fb);letter-spacing:.1em;color:var(--muted)}
.day b{display:block;margin-top:6px;font:var(--hw) 25px/1.1 var(--fh)}
.day .got{display:block;margin-top:6px;font:500 12px/1.35 var(--fb);color:var(--ok)}
.day:hover{border-color:var(--ac);background:#fff}
.day.has{border-color:var(--ok)}
.halves{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.half{min-height:120px;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:2px 2px 0 var(--line)}
.half i{display:block;font-style:normal;font-size:34px;line-height:1}
.half b{display:block;margin-top:12px;font:var(--hw) 26px/1.1 var(--fh)}
.half small{display:block;margin-top:4px;font:500 12px var(--fb);color:var(--ok)}
.half:hover{border-color:var(--ac);background:#fff}
.mine{margin-top:16px;background:#3d352b;color:#fff;border-radius:14px;padding:14px 16px}
.mine h3{margin:0 0 6px;font:700 15px var(--fb)}
.mine p{margin:0;font:400 13px/1.5 var(--fb);opacity:.85}
.mine ul{list-style:none;margin:0;padding:0}
.mine li{display:flex;gap:8px;align-items:center;padding:4px 0;font:500 14px var(--fb)}
.mine li em{font-style:normal;font-size:18px}
.tip{margin:12px 0 0;text-align:center;font:500 13px var(--fb);color:var(--muted)}
/* 프로그램 카드: 평소엔 색 카드, 마우스를 올리거나(한 번 누르면) 실제 활동 사진 */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.card{position:relative;aspect-ratio:1/1;border-radius:16px;overflow:hidden;color:#fff;text-align:left;background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:0 4px 10px rgba(60,40,20,.2);transition:transform .15s,box-shadow .15s}
.card .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.card .lb{position:absolute;left:12px;right:12px;bottom:12px;z-index:1}
.card .lb i{display:block;font-style:normal;font-size:24px;line-height:1;margin-bottom:8px}
.card .lb b{display:block;font:800 18px/1.2 var(--fb);text-shadow:0 1px 3px rgba(0,0,0,.35)}
.card .lb small{display:none;margin-top:3px;font:500 12px var(--fb)}
.card .tap{position:absolute;right:8px;top:8px;z-index:1;display:none;background:var(--ac);color:var(--on);border-radius:999px;padding:3px 9px;font:700 11px var(--fb)}
.card.peek .ph,.card:focus-visible .ph{opacity:1}
.card.peek::after,.card:focus-visible::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),transparent 55%)}
.card.peek .lb i,.card:focus-visible .lb i{display:none}
.card.peek .lb small,.card:focus-visible .lb small{display:block}
.card.peek .tap{display:block}
.card.peek{box-shadow:0 0 0 4px var(--ac),0 8px 18px rgba(60,40,20,.28)}
@media (hover:hover){.card:hover .ph{opacity:1}.card:hover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),transparent 55%)}
  .card:hover .lb i{display:none}.card:hover .lb small{display:block}.card:hover{transform:translateY(-2px)}}
.back{margin-top:8px}
/* 저장 */
.saved{margin:28px 4px 0;background:#fff;border-radius:18px;padding:22px 18px 18px;text-align:center;box-shadow:0 8px 20px rgba(60,40,20,.2);transform:rotate(-.6deg)}
.saved .ck{width:52px;height:52px;margin:0 auto;border-radius:50%;background:#e3ecd9;color:var(--ok);display:grid;place-items:center;font-size:26px}
.saved .stp{margin-top:12px}
.saved h2{margin:6px 0 8px;font:var(--hw) 30px/1.25 var(--fh);color:var(--ink)}
.saved p{margin:0;font:500 15px var(--fb);color:var(--muted)}
.saved .ph{margin:14px auto 0;max-width:360px;border-radius:10px;overflow:hidden;aspect-ratio:16/9}
.saved .ph img{width:100%;height:100%;object-fit:cover}
/* 결과: 월~금 표 */
.week{margin:18px 2px 0;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 20px rgba(60,40,20,.18)}
.week table{width:100%;border-collapse:collapse;table-layout:fixed}
.week th{background:#3d352b;color:#fff;font:700 14px var(--fb);padding:9px 2px}
.week td{vertical-align:top;text-align:center;border-left:1px solid var(--line);padding:8px 3px 10px}
.week td:first-child{border-left:0}
.week .it{display:block;margin-bottom:8px}
.week .it img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px}
.week .it b{display:block;margin-top:4px;font:700 12px/1.25 var(--fb);word-break:keep-all}
.week .it small{display:block;font:700 11px var(--fb);color:var(--ac)}
.week .none{display:block;padding:18px 0;font:500 12px var(--fb);color:#b7ac9b}
.week .none::before{content:"";display:block;width:6px;height:6px;margin:0 auto 6px;border-radius:50%;background:#d8cfbf}
@media (min-width:560px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="stage"><main class="app" id="app"></main></div>
<dialog id="help" aria-labelledby="ht"><h2 id="ht">이렇게 해요!</h2><ol><li>하고 싶은 요일을 골라요.</li><li>오전과 오후 중에서 골라요.</li><li>프로그램 카드에 마우스를 올리거나 한 번 누르면 활동 사진이 보여요. 한 번 더 누르면 골라져요.</li><li>다른 날도 고르거나 「선택 끝내기」를 눌러요.</li></ol><p>모든 날을 고르지 않아도 괜찮아요. 하고 싶은 날만, 하고 싶은 활동만 골라요.</p><button onclick="this.closest('dialog').close()">알겠어요</button></dialog>
<script src="../common/game.js"></script>
<script>
const BRAND={mark:'내',html:'내 <b>프로그램</b>'};
const DAYS=[['월','MON'],['화','TUE'],['수','WED'],['목','THU'],['금','FRI']];
const HALF=[['오전','🌞'],['오후','🌤️']];
// 프로그램 10개 — 11/18 프로그램 카드 10개 · 실사 사진 10장(오승은). 사진: tools/gen_1_4.py
const PROGS=[
  {id:'craft',v:'손끝 공방',e:'🧵',a:'십자수',say:'십자수로 예쁜 작품을 만들어요.',c:['#b4775a','#7d4b3a']},
  {id:'yoga',v:'고요한 시간',e:'🧘',a:'요가',say:'요가로 몸과 마음을 편안하게 해요.',c:['#5e9686','#33584f']},
  {id:'pingpong',v:'플레이 코트',e:'🏓',a:'탁구',say:'친구와 함께 탁구를 쳐요.',c:['#3a6f8e','#22445a']},
  {id:'cook',v:'맛있는 하루',e:'🍳',a:'요리',say:'맛있는 음식을 직접 만들어요.',c:['#ad8a3c','#6b5124']},
  {id:'drawing',v:'상상 미술관',e:'🎨',a:'디지털 드로잉',say:'태블릿으로 그림을 그려요.',c:['#a45e72','#5c3442']},
  {id:'drone',v:'조종 탐험대',e:'🚁',a:'드론',say:'드론을 조종해서 하늘로 날려요.',c:['#52719a','#2c4260']},
  {id:'nanta',v:'두드림',e:'🥁',a:'난타',say:'북을 신나게 두드려요.',c:['#6b5a99','#3d3463']},
  {id:'movie',v:'스크린 산책',e:'🎬',a:'영화 감상',say:'영화를 보고 이야기를 나눠요.',c:['#6a4f63','#3a2b37']},
  {id:'camp',v:'감성캠핑',e:'⛺',a:'캠핑',say:'자연에서 캠핑을 즐겨요.',c:['#3f6d5f','#223f37']},
  {id:'computer',v:'배움의 문',e:'📚',a:'컴퓨터',say:'컴퓨터 쓰는 법을 배워요.',c:['#7a5f45','#45362a']}
];
const P=id=>PROGS.find(p=>p.id===id);
const img=id=>`img/p-${id}.jpg`;
const touch=matchMedia('(hover: none)');

const root=document.getElementById('app');
let plan={},day=null,half=null,peek=null;   // plan['0-1'] = 프로그램 id (월요일 오후)
const quiet=()=>{try{speechSynthesis.cancel()}catch(e){}};
const keys=()=>Object.keys(plan).sort();
const slotName=k=>`${DAYS[k[0]][0]}요일 ${HALF[k[2]][0]}`;

function mineBox(){
  const ks=keys();
  return `<div class="mine"><h3>⭐ 내가 고른 것</h3>${ks.length?`<ul>${ks.map(k=>`<li><em>${P(plan[k]).e}</em>${slotName(k)} · ${P(plan[k]).v}</li>`).join('')}</ul>`:'<p>아직 고른 활동이 없어요. 첫 번째 활동을 골라 보세요!</p>'}</div>`;
}

function home(){
  quiet();plan={};
  DK.mount(root,`${DK.hbar(BRAND)}
  <section class="hero"><span class="eb">Weekly choice game</span><h1 class="h1">내 프로그램<br><em>내 손으로!</em></h1><p>하고 싶은 날과 시간을 고르고, 나에게 딱 맞는 프로그램을 찾아 보세요!</p></section>
  <div class="photo tilt-r"><i class="tp"></i><span class="cp"><img src="img/start.jpg" alt="십자수, 요리, 탁구, 캠핑 사진"></span><span class="ct">내가 하고 싶은 활동을 골라요<small>월요일~금요일 · 오전·오후 · 프로그램 10개</small></span></div>
  <div class="acts"><button class="btn pri" data-act="start">시작하기</button><button class="btn sec" data-say="내 프로그램 내 손으로! 하고 싶은 날과 시간을 고르고, 나에게 딱 맞는 프로그램을 찾아 보세요!">🔊 듣기</button></div>${DK.DKU}`,
  {start:pickDay});
}

// STEP 1 요일
function pickDay(){
  quiet();day=half=peek=null;
  const ks=keys();
  DK.mount(root,`${DK.hbar(BRAND,true)}
  ${DK.seg(3,0)}
  <span class="stp">STEP 1 · 요일</span>
  <p class="saybig" style="margin-top:6px"><span>언제 하고 싶나요?</span><button class="spk" data-say="언제 하고 싶나요? 하고 싶은 요일을 골라요." aria-label="듣기">${DK.SPK}</button></p>
  <div class="days">${DAYS.map(([d,en],i)=>{const got=[0,1].filter(h=>plan[`${i}-${h}`]).map(h=>`${HALF[h][0]} ${P(plan[`${i}-${h}`]).v}`);
    return `<button class="day${got.length?' has':''}" data-act="day" data-i="${i}"><small>${en}</small><b>${d}요일</b>${got.length?`<span class="got">✓ ${got.join('<br>✓ ')}</span>`:''}</button>`}).join('')}</div>
  <p class="tip">모든 날을 고르지 않아도 괜찮아요. 하고 싶은 날만 골라요.</p>
  ${mineBox()}
  ${ks.length?'<div class="acts"><button class="btn pri" data-act="end">선택 끝내기</button></div>':''}${DK.DKU}`,
  {home,day:b=>pickHalf(+b.dataset.i),end:result});
  DK.speak(ks.length?'다른 요일을 골라 보세요.':'언제 하고 싶나요? 하고 싶은 요일을 골라요.');
}

// STEP 2 오전·오후
function pickHalf(i){
  quiet();day=i;half=null;peek=null;
  DK.mount(root,`${DK.hbar(BRAND,true)}
  ${DK.seg(3,1)}
  <span class="stp">STEP 2 · 시간 · ${DAYS[i][0]}요일</span>
  <p class="saybig" style="margin-top:6px"><span>언제 하고 싶나요?</span><button class="spk" data-say="${DAYS[i][0]}요일, 오전과 오후 중에서 골라요." aria-label="듣기">${DK.SPK}</button></p>
  <div class="halves">${HALF.map(([h,e],k)=>{const p=plan[`${i}-${k}`]&&P(plan[`${i}-${k}`]);
    return `<button class="half" data-act="half" data-k="${k}"><i aria-hidden="true">${e}</i><b>${h}</b>${p?`<small>✓ ${p.v} (다시 고를 수 있어요)</small>`:''}</button>`}).join('')}</div>
  <div class="acts back"><button class="btn sec" data-act="re">‹ 요일 다시 고르기</button></div>${DK.DKU}`,
  {home,half:b=>pickProg(+b.dataset.k),re:pickDay});
  DK.speak(`${DAYS[i][0]}요일, 오전과 오후 중에서 골라요.`);
}

// STEP 3 프로그램
function pickProg(k){
  quiet();half=k;peek=null;
  DK.mount(root,`${DK.hbar(BRAND,true)}
  ${DK.seg(3,2)}
  <span class="stp">${DAYS[day][0]}요일 ${HALF[k][0]} 선택</span>
  <p class="saybig" style="margin-top:6px"><span>무엇을 하고 싶나요?</span><button class="spk" data-say="무엇을 하고 싶나요?" aria-label="듣기">${DK.SPK}</button></p>
  <p class="qs" style="margin-top:8px">${touch.matches?'카드를 <b>한 번</b> 누르면 활동 사진이 보이고, <b>한 번 더</b> 누르면 골라져요.':'카드에 <b>마우스를 올리면</b> 활동 사진을 볼 수 있어요. 누르면 골라져요.'}</p>
  <div class="cards">${PROGS.map(p=>`<button class="card" data-id="${p.id}" style="--c1:${p.c[0]};--c2:${p.c[1]}" aria-label="${p.v}, ${p.a}. ${p.say}"><img class="ph" src="${img(p.id)}" alt="" loading="lazy"><span class="tap">한 번 더 누르면 골라요</span><span class="lb"><i aria-hidden="true">${p.e}</i><b>${p.v}</b><small>${p.a}</small></span></button>`).join('')}</div>
  <p class="tip">하고 싶은 날만, 하고 싶은 활동만 골라요.</p>
  <div class="acts back"><button class="btn sec" data-act="re">‹ 시간 다시 고르기</button></div>${DK.DKU}`,
  {home,re:()=>pickHalf(day)});
  root.querySelectorAll('.card').forEach(b=>{
    const id=b.dataset.id;
    b.onclick=()=>{
      if(touch.matches&&peek!==id){
        peek=id;root.querySelectorAll('.card').forEach(c=>c.classList.toggle('peek',c===b));
        const p=P(id);DK.speak(`${p.v}. ${p.a}. ${p.say}`);return;
      }
      choose(id);
    };
    b.onmouseenter=()=>{if(!touch.matches){const p=P(id);DK.speak(`${p.v}. ${p.a}.`)}};
  });
}

function choose(id){
  quiet();const p=P(id),k=`${day}-${half}`;plan[k]=id;
  const msg=`${DAYS[day][0]}요일 ${HALF[half][0]}에 ${p.v}${DK.eul(p.v)} 골랐어요!`;
  DK.mount(root,`${DK.hbar(BRAND,true)}
  <div class="saved"><div class="ck" aria-hidden="true">✓</div><span class="stp">SAVED!</span><h2>${msg}</h2><p>다른 날도 골라 볼까요?</p>
  <div class="ph"><img src="${img(id)}" alt="${p.a} 사진"></div>
  <div class="acts two"><button class="btn pri" data-act="more">다른 날 고르기</button><button class="btn sec" data-act="end">선택 끝내기</button></div></div>
  <p class="tip">하고 싶은 날만, 하고 싶은 활동만 골라요.</p>${DK.DKU}`,
  {home,more:pickDay,end:result});
  DK.speak(msg+' 다른 날도 골라 볼까요?');
}

const weekText=()=>{const ks=keys();return ks.length?ks.map(k=>`${slotName(k)}, ${P(plan[k]).v}.`).join(' '):'고른 활동이 없어요.'};

// 결과: 나의 다음 주
function result(){
  quiet();
  const ks=keys();
  DK.mount(root,`${DK.hbar(BRAND,true)}
  <section class="hero"><span class="eb">My next week</span><h1 class="h1">🎉 나의 다음 주가<br><em>완성됐어요!</em></h1><p>내가 고른 활동으로 나만의 한 주를 만들었어요!</p></section>
  <div class="week"><table><thead><tr>${DAYS.map(([d])=>`<th scope="col">${d}</th>`).join('')}</tr></thead><tbody><tr>${DAYS.map(([d],i)=>{
    const it=[0,1].filter(h=>plan[`${i}-${h}`]).map(h=>{const p=P(plan[`${i}-${h}`]);return `<span class="it"><img src="${img(p.id)}" alt="${p.a}"><b>${p.e} ${p.v}</b><small>${HALF[h][0]}</small></span>`}).join('');
    return `<td>${it||`<span class="none">${d}요일</span>`}</td>`}).join('')}</tr></tbody></table></div>
  ${DK.sayBig(ks.length?weekText():'아직 고른 활동이 없어요.')}
  <div class="acts"><button class="btn line" data-act="listen">🔊 다음 주 듣기</button><div class="acts two" style="margin:0"><button class="btn sec" data-act="more">‹ 더 고르기</button><button class="btn pri" data-act="again">↻ 다시 하기</button></div></div>${DK.DKU}`,{
    home,listen:()=>DK.speak(weekText()),more:pickDay,again:home
  });
  DK.done({plan:ks.map(k=>({when:slotName(k),program:P(plan[k]).v,activity:P(plan[k]).a}))});
  DK.speak('나의 다음 주가 완성됐어요! '+weekText());
}

home();
</script>
</body>
</html>
