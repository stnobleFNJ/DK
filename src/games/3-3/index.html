<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내 마음 표현하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=Gowun+Batang:wght@400;700&family=Gaegu:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/paper.css">
<style>
.hero-faces{display:flex;justify-content:center;gap:8px;margin:10px 0 2px}
.hero-faces img{width:23%;aspect-ratio:1;object-fit:cover;background:#fff;padding:4px;box-shadow:0 4px 10px rgba(60,40,20,.16);transform:rotate(-4deg)}
.hero-faces img:nth-child(even){transform:rotate(4deg)}
.sit{margin:16px 4px 0}
.sit .cp{aspect-ratio:16/9}
.sit .ct{display:flex;gap:10px;align-items:center;font-size:22px}
.sit .ct span{flex:1}
.sit.small{display:flex;gap:10px;align-items:center;padding:6px 10px 6px 6px}
.sit.small .cp{flex:none;width:38%}
.sit.small .ct{padding:0;font-size:19px}
/* 마음·이유 보기 2×2: 사진 + 사진 아래 문장 */
.picks{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 2px}
.pc{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:6px 6px 10px;background:#fff;border:3px solid transparent;border-radius:8px;box-shadow:0 4px 10px rgba(60,40,20,.16);text-align:center;transition:border-color .15s,background .15s}
.pc .pi{display:block;aspect-ratio:16/9;overflow:hidden;border-radius:4px;background:var(--soft)}
.pc .pi img{width:100%;height:100%;object-fit:cover}
.pc .pv{font:var(--hw) 21px/1.25 var(--fh);letter-spacing:-.02em;color:#3d352b;text-wrap:balance}
.pc.why .pv{font-size:17px;line-height:1.3}
.pc:hover{border-color:var(--line)}
.pc.on{border-color:var(--ac);background:#fffaf2}
.mine{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--ac);border-radius:999px;padding:4px 14px 4px 4px;font:var(--hw) 19px var(--fh);color:var(--ac);margin-top:12px}
.mine img{width:52px;height:36px;object-fit:cover;border-radius:999px}
/* 결과 */
.rl{display:grid;gap:14px;margin-top:14px}
.rc{position:relative;background:#fff;padding:8px 8px 12px;box-shadow:0 5px 12px rgba(60,40,20,.16)}
.rc:nth-child(odd){transform:rotate(-.8deg)}.rc:nth-child(even){transform:rotate(.8deg)}
.rc .top{display:flex;gap:10px;align-items:center}
.rc .cp{flex:none;width:34%;aspect-ratio:3/2;overflow:hidden}
.rc .cp img{width:100%;height:100%;object-fit:cover}
.rc .fi{flex:none;width:22%;aspect-ratio:16/9;object-fit:cover;border-radius:4px}
.rc .no{font:700 11px var(--fm);color:var(--ac);letter-spacing:.1em}
.rc p{display:flex;gap:10px;align-items:flex-start;margin:8px 2px 0;font:var(--hw) 20px/1.45 var(--fh);color:#3d352b}
.rc p span{flex:1}
.rc .spk{width:34px;height:34px}
</style>
</head>
<body>
<div class="stage"><main class="app" id="app"></main></div>
<dialog id="help" aria-labelledby="ht"><h2 id="ht">이렇게 해요!</h2><ol><li>사진을 보고 어떤 상황인지 알아봐요.</li><li>어떤 마음이 드는지 사진 하나를 골라요.</li><li>왜 그런 마음이 드는지 이유 사진 하나를 골라요.</li><li>4가지 상황을 모두 하면 내 마음 문장이 완성돼요.</li></ol><p>정답은 없어요. 내 마음대로 골라요. ‹ 이전 버튼으로 다시 고를 수 있어요.</p><button onclick="this.closest('dialog').close()">알겠어요</button></dialog>
<script src="../common/game.js"></script>
<script>
const BRAND={mark:'마',html:'내 마음 <b>표현하기</b>'};
const STEPS=['상황','마음','이유'];
// 상황·마음·이유 문장과 사진 = 「사진 적용시 참고 사항」(전3-3) 그대로. 사진은 tools/gen_3_3.py로 만든 실제 사진.
// link: 마지막 문장 앞부분(상황 문장의 연결형). 예) 여자친구를 만나서 + 기뻐요. 그 이유는 + 오랜만에 만나서요.
// 사진 파일: sN-sit.jpg(상황) · sN-fK.jpg(마음 K번째) · sN-wK.jpg(이유 K번째)
const SITS=[
  {cap:'여자친구를 만났어요.',link:'여자친구를 만나서',
   feels:['기뻐요','설레요','긴장돼요','미안해요'],
   whys:['오랜만에 만나서요','함께 놀러 갈 거라서요','무슨 말을 해야 할지 몰라서요','약속 시간에 늦어서요']},
  {cap:'약속이 취소되었어요.',link:'약속이 취소되어서',
   feels:['슬퍼요','실망스러워요','속상해요','짜증 나요'],
   whys:['보고 싶었던 사람을 못 만나서요','함께 놀러 가기로 했는데 못 가서요','나갈 준비를 다 했는데 못 만나게 돼서요','미리 말하지 않고 갑자기 취소해서요']},
  {cap:'낯선 곳에 갔어요.',link:'낯선 곳에 가서',
   feels:['설레요','긴장돼요','무서워요','걱정돼요'],
   whys:['새로운 것을 구경할 수 있어서요','어디로 가야 할지 몰라서요','길을 잃을까 봐요','집으로 돌아가는 길을 몰라서요']},
  {cap:'생일 선물을 받았어요.',link:'생일 선물을 받아서',
   feels:['기뻐요','고마워요','궁금해요','실망스러워요'],
   whys:['갖고 싶었던 선물을 받아서요','내 생일을 기억하고 선물을 준비해 줘서요','포장 안에 무엇이 들어 있는지 몰라서요','내가 좋아하는 선물이 아니라서요']}
].map((s,i)=>({...s,img:`img/s${i+1}-sit.jpg`,fimg:k=>`img/s${i+1}-f${k+1}.jpg`,wimg:k=>`img/s${i+1}-w${k+1}.jpg`}));
// 문장: "여자친구를 만나서 기뻐요. 그 이유는 오랜만에 만나서요." (요청서 예시 형식)
const sentence=(s,a)=>`${s.link} ${s.feels[a.f]}. 그 이유는 ${s.whys[a.w]}.`;
const card=(cls,img,text,k,on)=>`<button class="pc ${cls}${on?' on':''}" data-act="pick" data-k="${k}" aria-label="${DK.esc(text)}" aria-pressed="${on?'true':'false'}"><span class="pi"><img src="${img}" alt=""></span><span class="pv">${text}</span></button>`;

const root=document.getElementById('app');
let ans=[],timers=[];
const clear=()=>{timers.forEach(clearTimeout);timers=[];try{speechSynthesis.cancel()}catch(e){}};
const later=(f,ms)=>timers.push(setTimeout(f,ms));

function home(){
  clear();ans=[];
  const intro='내 마음을 표현해 보세요!';
  DK.mount(root,`${DK.hbar(BRAND)}
  <section class="hero"><span class="eb">Express my feelings</span><h1 class="h1">내 마음을<br><em>표현해 보세요!</em></h1><p>상황을 보고, 어떤 마음이 드는지와 그 이유를 골라요. 4가지 상황이 있어요.</p></section>
  ${DK.steps(STEPS,0)}
  <div class="hero-faces" aria-hidden="true"><img src="img/s1-f1.jpg" alt=""><img src="img/s2-f1.jpg" alt=""><img src="img/s3-f3.jpg" alt=""><img src="img/s4-f2.jpg" alt=""></div>
  <div class="acts"><button class="btn pri" data-act="start">시작하기</button><button class="btn sec" data-say="${intro}">🔊 듣기</button></div>${DK.DKU}`,{start:()=>feel(0)});
}

// 1단계: 상황 보고 마음 고르기
function feel(i){
  clear();
  const s=SITS[i],a=ans[i]||{};
  const intro=`어떤 상황인가요? ${s.cap} 어떤 마음이 들까요?`;
  DK.mount(root,`${DK.hbar(BRAND,true)}
  ${DK.seg(SITS.length,i)}
  <div class="photo sit tilt-l"><i class="tp"></i><span class="cp"><img src="${s.img}" alt="${DK.esc(s.cap)}"></span><span class="ct"><span><small style="font:700 12px var(--fb);color:var(--ac)">상황 ${i+1} · 어떤 상황인가요?</small>${s.cap}</span><button class="spk" data-say="${DK.esc(intro)}" aria-label="소리로 듣기">${DK.SPK}</button></span></div>
  <p class="q">어떤 마음이 들까요?</p><p class="qs">내 마음과 같은 것 하나를 골라요.</p>
  <div class="picks">${s.feels.map((f,k)=>card('feel',s.fimg(k),f,k,a.f===k)).join('')}</div>
  <div class="acts two"><button class="btn sec" data-act="prev">‹ 이전</button><button class="btn pri" data-act="next" ${a.f!=null?'':'disabled'}>다음 ›</button></div>${DK.DKU}`,{
    home,prev:()=>i?why(i-1):home(),next:()=>ans[i]&&ans[i].f!=null&&why(i),
    pick:b=>{
      const k=+b.dataset.k;
      if(!ans[i]||ans[i].f!==k)ans[i]={f:k};      // 마음을 바꾸면 이유는 다시 고른다
      root.querySelectorAll('.pc').forEach(p=>{p.classList.toggle('on',p===b);p.setAttribute('aria-pressed',p===b)});
      root.querySelector('[data-act=next]').disabled=false;
      DK.speak(s.feels[k]);
      later(()=>why(i),800);
    }
  });
  DK.speak(intro);
}

// 2단계: 이유 고르기 → 문장 완성
function why(i){
  clear();
  const s=SITS[i],a=ans[i],f=s.feels[a.f],last=i===SITS.length-1;
  const intro=`${s.link} ${f}. 왜 그런 마음이 들까요?`;
  const done=()=>a.w!=null;
  DK.mount(root,`${DK.hbar(BRAND,true)}
  ${DK.seg(SITS.length,i)}
  <div class="photo sit small"><span class="cp"><img src="${s.img}" alt=""></span><span class="ct">${s.cap}</span></div>
  <span class="mine"><img src="${s.fimg(a.f)}" alt="">${f}</span>
  <p class="q">왜 그런 마음이 들까요?</p><p class="qs">이유 하나를 골라요.</p>
  <div class="picks">${s.whys.map((w,k)=>card('why',s.wimg(k),w,k,a.w===k)).join('')}</div>
  <div id="say">${done()?DK.sayBig(sentence(s,a)):''}</div>
  <div class="acts two"><button class="btn sec" data-act="prev">‹ 이전</button><button class="btn pri" data-act="next" ${done()?'':'disabled'}>${last?'내 마음 문장 보기 ›':'다음 상황 ›'}</button></div>${DK.DKU}`,{
    home,prev:()=>feel(i),next:()=>done()&&(last?finish():feel(i+1)),
    pick:b=>{
      a.w=+b.dataset.k;
      root.querySelectorAll('.pc').forEach(p=>{p.classList.toggle('on',p===b);p.setAttribute('aria-pressed',p===b)});
      const t=sentence(s,a),say=root.querySelector('#say');
      say.innerHTML=DK.sayBig(t);say.querySelector('[data-say]').onclick=()=>DK.speak(t);
      root.querySelector('[data-act=next]').disabled=false;
      DK.speak(t);
      say.scrollIntoView({behavior:'smooth',block:'nearest'});
    }
  });
  DK.speak(intro);
}

function finish(){
  clear();
  const all=SITS.map((s,i)=>sentence(s,ans[i]));
  const head='내 마음을 표현했어요!';
  DK.mount(root,`${DK.hbar(BRAND,true)}
  ${DK.steps(STEPS,2)}
  <p class="q">${head}</p><p class="qs">4가지 상황에서 내 마음은 이랬어요.</p>
  <div class="rl">${SITS.map((s,i)=>`<div class="rc"><div class="top"><span class="cp"><img src="${s.img}" alt=""></span><span style="flex:1"><span class="no">상황 ${i+1}</span><br>${s.cap}</span><img class="fi" src="${s.fimg(ans[i].f)}" alt="${DK.esc(s.feels[ans[i].f])}"></div><p><span>${all[i]}</span><button class="spk" data-say="${DK.esc(all[i])}" aria-label="소리로 듣기">${DK.SPK}</button></p></div>`).join('')}</div>
  <div class="acts two"><button class="btn sec" data-act="listen">🔊 다시 듣기</button><button class="btn pri" data-act="again">↻ 다시 해 보기</button></div>${DK.DKU}`,{
    home,again:()=>{ans=[];feel(0)},listen:()=>DK.speak(`${head} ${all.join(' ')}`)
  });
  DK.done();
  later(()=>DK.speak(head),400);
}

home();
</script>
</body>
</html>
