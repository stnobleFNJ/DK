<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내 마음 표현하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=Gowun+Batang:wght@400;700&family=Gaegu:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/paper.css">
<style>
.hero-faces{display:flex;justify-content:center;gap:10px;font-size:46px;margin:6px 0 2px}
.hero-faces span{display:inline-block;transform:rotate(-6deg)}
.hero-faces span:nth-child(even){transform:rotate(6deg)}
.sit{margin:16px 4px 0}
.sit .cp{aspect-ratio:3/2}
.sit .ct{display:flex;gap:10px;align-items:center;font-size:22px}
.sit .ct span{flex:1}
.sit.small{display:flex;gap:10px;align-items:center;padding:6px 10px 6px 6px}
.sit.small .cp{flex:none;width:38%}
.sit.small .ct{padding:0;font-size:19px}
/* 마음 보기 2×2 */
.feels{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 2px}
.feel{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px 12px;background:var(--paper);border:2px solid var(--line);border-radius:16px;box-shadow:2px 2px 0 var(--line);min-height:112px;justify-content:center;transition:border-color .15s,background .15s}
.feel .fe{font-size:46px;line-height:1}
.feel .fv{font:var(--hw) 22px var(--fh)}
.feel:hover{border-color:var(--ac)}
.feel.on{border-color:var(--ac);background:#fff;box-shadow:0 0 0 3px var(--ac)}
.mine{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--ac);border-radius:999px;padding:4px 12px 4px 6px;font:var(--hw) 19px var(--fh);color:var(--ac);margin-top:12px}
.mine i{font-style:normal;font-size:24px}
.opt{min-height:58px;align-items:center;font-size:17px}
/* 결과 */
.rl{display:grid;gap:14px;margin-top:14px}
.rc{position:relative;background:#fff;padding:8px 8px 12px;box-shadow:0 5px 12px rgba(60,40,20,.16)}
.rc:nth-child(odd){transform:rotate(-.8deg)}.rc:nth-child(even){transform:rotate(.8deg)}
.rc .top{display:flex;gap:10px;align-items:center}
.rc .cp{flex:none;width:34%;aspect-ratio:3/2;overflow:hidden}
.rc .cp img{width:100%;height:100%;object-fit:cover}
.rc .fe{font-size:40px;line-height:1}
.rc .no{font:700 11px var(--fm);color:var(--ac);letter-spacing:.1em}
.rc p{display:flex;gap:10px;align-items:flex-start;margin:8px 2px 0;font:var(--hw) 20px/1.45 var(--fh);color:#3d352b}
.rc p span{flex:1}
.rc .spk{width:34px;height:34px}
</style>
</head>
<body>
<div class="stage"><main class="app" id="app"></main></div>
<dialog id="help" aria-labelledby="ht"><h2 id="ht">이렇게 해요!</h2><ol><li>그림을 보고 어떤 상황인지 알아봐요.</li><li>어떤 마음이 드는지 하나 골라요.</li><li>왜 그런 마음이 드는지 이유를 하나 골라요.</li><li>4가지 상황을 모두 하면 내 마음 문장이 완성돼요.</li></ol><p>정답은 없어요. 내 마음대로 골라요. ‹ 이전 버튼으로 다시 고를 수 있어요.</p><button onclick="this.closest('dialog').close()">알겠어요</button></dialog>
<script src="../common/game.js"></script>
<script>
const BRAND={mark:'마',html:'내 마음 <b>표현하기</b>'};
const STEPS=['상황','마음','이유'];
// 상황 4가지 = 요청서 문구. 문장 앞부분은 조사 도우미로 만든다: 낱말 + 조사 + 뒷말 (예: 생일 선물 + 을 + 받아서)
// 상황별 마음 4개·이유 4개는 요청서에 없어 임시로 만들었다. 그림은 임시 그림(tools/gen_3_3.py).
const SITS=[
  {cap:'여자친구·남자친구를 만났어요.',img:'img/sit-date.jpg',alt:'두 사람이 만나 웃고 있어요',
   stem:()=>`여자친구(남자친구)${DK.eul('남자친구')} 만나서`,
   // 임시: 마음 4개·이유 4개
   feels:[{v:'기뻐요',e:'😊'},{v:'설레요',e:'🥰'},{v:'부끄러워요',e:'😳'},{v:'떨려요',e:'😬'}],
   whys:['보고 싶었던 사람을 만나서요','같이 맛있는 것을 먹을 수 있어서요','무슨 말을 할지 몰라서요','오랜만에 만나서요']},
  {cap:'약속이 취소되었어요.',img:'img/sit-cancel.jpg',alt:'휴대폰으로 약속이 취소되었다는 연락을 받았어요',
   stem:()=>`약속${DK.iga('약속')} 취소되어서`,
   // 임시: 마음 4개·이유 4개
   feels:[{v:'속상해요',e:'😢'},{v:'아쉬워요',e:'😞'},{v:'화나요',e:'😠'},{v:'괜찮아요',e:'🙂'}],
   whys:['많이 기다렸던 약속이라서요','갑자기 취소되어서요','다음에 또 만날 수 있어서요','집에서 쉴 수 있어서요']},
  {cap:'낯선 곳에 갔어요.',img:'img/sit-strange.jpg',alt:'처음 가 본 거리에서 지도를 보고 있어요',
   stem:()=>'낯선 곳에 가서',
   // 임시: 마음 4개·이유 4개
   feels:[{v:'무서워요',e:'😨'},{v:'불안해요',e:'😟'},{v:'궁금해요',e:'🤔'},{v:'신나요',e:'🤩'}],
   whys:['길을 잃을까 봐서요','아는 사람이 없어서요','새로운 것을 볼 수 있어서요','처음 와 본 곳이라서요']},
  {cap:'생일 선물을 받았어요.',img:'img/sit-gift.jpg',alt:'생일 케이크와 선물 상자',
   stem:()=>`생일 선물${DK.eul('생일 선물')} 받아서`,
   // 임시: 마음 4개(기뻐요는 요청서 예시)·이유 4개(첫째는 요청서 예시)
   feels:[{v:'기뻐요',e:'😊'},{v:'고마워요',e:'🤗'},{v:'놀랐어요',e:'😲'},{v:'신나요',e:'🤩'}],
   whys:['갖고 싶었던 선물을 받아서요','나를 생각해 준 마음이 고마워서요','생각하지 못한 선물이라서요','빨리 열어 보고 싶어서요']}
];
// 문장: "생일 선물을 받아서 기뻐요. 그 이유는 갖고 싶었던 선물을 받아서요." (요청서 예시 형식)
const sentence=(s,a)=>`${s.stem()} ${s.feels[a.f].v}. 그 이유는 ${s.whys[a.w]}.`;

const root=document.getElementById('app');
let ans=[],timers=[];
const clear=()=>{timers.forEach(clearTimeout);timers=[];try{speechSynthesis.cancel()}catch(e){}};
const later=(f,ms)=>timers.push(setTimeout(f,ms));

function home(){
  clear();ans=[];
  const intro='내 마음을 표현해 보세요!';
  DK.mount(root,`${DK.hbar(BRAND)}
  <section class="hero"><span class="eb">Express my feelings</span><h1 class="h1">내 마음을<br><em>표현해 보세요!</em></h1><p>상황을 보고, 어떤 마음이 드는지와 그 이유를 골라요. 4가지 상황이 있어요.</p></section>
  ${DK.steps(STEPS,0)}
  <div class="hero-faces" aria-hidden="true"><span>😊</span><span>😢</span><span>😨</span><span>🤗</span></div>
  <div class="acts"><button class="btn pri" data-act="start">시작하기</button><button class="btn sec" data-say="${intro}">🔊 듣기</button></div>${DK.DKU}`,{start:()=>feel(0)});
}

// 1단계: 상황 보고 마음 고르기
function feel(i){
  clear();
  const s=SITS[i],a=ans[i]||{};
  const intro=`어떤 상황인가요? ${s.cap} 어떤 마음이 들까요?`;
  DK.mount(root,`${DK.hbar(BRAND,true)}
  ${DK.seg(SITS.length,i)}
  <div class="photo sit tilt-l"><i class="tp"></i><span class="cp"><img src="${s.img}" alt="${s.alt}"></span><span class="ct"><span><small style="font:700 12px var(--fb);color:var(--ac)">상황 ${i+1} · 어떤 상황인가요?</small>${s.cap}</span><button class="spk" data-say="${DK.esc(intro)}" aria-label="소리로 듣기">${DK.SPK}</button></span></div>
  <p class="q">어떤 마음이 들까요?</p><p class="qs">내 마음과 같은 것 하나를 골라요.</p>
  <div class="feels">${s.feels.map((f,k)=>`<button class="feel${a.f===k?' on':''}" data-act="pick" data-k="${k}" aria-label="${f.v}"><span class="fe" aria-hidden="true">${f.e}</span><span class="fv">${f.v}</span></button>`).join('')}</div>
  <div class="acts two"><button class="btn sec" data-act="prev">‹ 이전</button><button class="btn pri" data-act="next" ${a.f!=null?'':'disabled'}>다음 ›</button></div>${DK.DKU}`,{
    home,prev:()=>i?why(i-1):home(),next:()=>ans[i]&&ans[i].f!=null&&why(i),
    pick:b=>{
      const k=+b.dataset.k;
      if(!ans[i]||ans[i].f!==k)ans[i]={f:k};      // 마음을 바꾸면 이유는 다시 고른다
      root.querySelectorAll('.feel').forEach(p=>p.classList.toggle('on',p===b));
      root.querySelector('[data-act=next]').disabled=false;
      DK.speak(s.feels[k].v);
      later(()=>why(i),800);
    }
  });
  DK.speak(intro);
}

// 2단계: 이유 고르기 → 문장 완성
function why(i){
  clear();
  const s=SITS[i],a=ans[i],f=s.feels[a.f],last=i===SITS.length-1;
  const intro=`${s.stem()} ${f.v}. 왜 그런 마음이 들까요?`;
  const done=()=>a.w!=null;
  DK.mount(root,`${DK.hbar(BRAND,true)}
  ${DK.seg(SITS.length,i)}
  <div class="photo sit small"><span class="cp"><img src="${s.img}" alt="${s.alt}"></span><span class="ct">${s.cap}</span></div>
  <span class="mine"><i aria-hidden="true">${f.e}</i>${f.v}</span>
  <p class="q">왜 그런 마음이 들까요?</p><p class="qs">이유 하나를 골라요.</p>
  <div class="opts">${s.whys.map((w,k)=>`<button class="opt${a.w===k?' on':''}" data-act="pick" data-k="${k}"><span class="no">${k+1}</span><span>${w}</span></button>`).join('')}</div>
  <div id="say">${done()?DK.sayBig(sentence(s,a)):''}</div>
  <div class="acts two"><button class="btn sec" data-act="prev">‹ 이전</button><button class="btn pri" data-act="next" ${done()?'':'disabled'}>${last?'내 마음 문장 보기 ›':'다음 상황 ›'}</button></div>${DK.DKU}`,{
    home,prev:()=>feel(i),next:()=>done()&&(last?finish():feel(i+1)),
    pick:b=>{
      a.w=+b.dataset.k;
      root.querySelectorAll('.opt').forEach(p=>p.classList.toggle('on',p===b));
      const t=sentence(s,a),say=root.querySelector('#say');
      say.innerHTML=DK.sayBig(t);say.querySelector('[data-say]').onclick=()=>DK.speak(t);
      root.querySelector('[data-act=next]').disabled=false;
      DK.speak(t);
      say.scrollIntoView({behavior:'smooth',block:'nearest'});
    }
  });
  DK.speak(intro);
}

function finish(){
  clear();
  const all=SITS.map((s,i)=>sentence(s,ans[i]));
  const head='내 마음을 표현했어요!';
  DK.mount(root,`${DK.hbar(BRAND,true)}
  ${DK.steps(STEPS,2)}
  <p class="q">${head}</p><p class="qs">4가지 상황에서 내 마음은 이랬어요.</p>
  <div class="rl">${SITS.map((s,i)=>`<div class="rc"><div class="top"><span class="cp"><img src="${s.img}" alt="${s.alt}"></span><span style="flex:1"><span class="no">상황 ${i+1}</span><br>${s.cap}</span><span class="fe" aria-hidden="true">${s.feels[ans[i].f].e}</span></div><p><span>${all[i]}</span><button class="spk" data-say="${DK.esc(all[i])}" aria-label="소리로 듣기">${DK.SPK}</button></p></div>`).join('')}</div>
  <div class="acts two"><button class="btn sec" data-act="listen">🔊 다시 듣기</button><button class="btn pri" data-act="again">↻ 다시 해 보기</button></div>${DK.DKU}`,{
    home,again:()=>{ans=[];feel(0)},listen:()=>DK.speak(`${head} ${all.join(' ')}`)
  });
  later(()=>DK.speak(head),400);
}

home();
</script>
</body>
</html>
