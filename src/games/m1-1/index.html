<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efdf">
<title>나의 생활, 나의 선택</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=Gowun+Batang:wght@400;700&family=Gaegu:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/paper.css">
<style>
/* 주제 탭 */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0 0}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;border-radius:12px;background:var(--paper);border:1.5px solid var(--line);font:700 14px/1.25 var(--fb);text-align:center;color:var(--ink)}
.tabs button b{width:22px;height:22px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font:700 12px var(--fb);color:var(--muted)}
.tabs button small{font:500 11px var(--fb);color:var(--muted)}
.tabs button.on{border-color:var(--ac);background:#fff;box-shadow:2px 2px 0 var(--line)}
.tabs button.on b{background:var(--ac);color:var(--on)}
.tabs button.done small{color:var(--ok);font-weight:700}
/* 제목 + 고른 개수 */
.thead{display:flex;align-items:flex-end;gap:10px;margin:16px 0 4px}
.thead .q{flex:1;margin:0}
.cnt{flex:none;text-align:center;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:6px 10px 4px;min-width:70px}
.cnt b{font:var(--hw) 30px/1 var(--fh);color:var(--ac)}
.cnt span{font:700 15px var(--fb);color:var(--muted)}
.cnt small{display:block;font:500 11px var(--fb);color:var(--muted)}
/* 사진 8장 2열 */
.picks.eight{grid-template-columns:1fr 1fr;gap:16px 12px}
.picks.eight .photo{padding:6px 6px 10px}
.picks.eight .photo .cp{aspect-ratio:1}
.picks.eight .photo .ct{font-size:19px;padding-top:6px}
.picks.eight .pick:disabled{opacity:.5}
.picks.eight .pick .cn{right:10px;top:10px;width:32px;height:32px;font-size:15px}
.full{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:#fff7e0;font-size:14px;font-weight:700;color:#7a5a12}
/* 처음 화면: 주제 3개 */
.topics{display:grid;gap:16px;margin-top:6px;padding:8px 4px 0}
.topic{display:flex;align-items:center;gap:12px;text-align:left}
.topic .cp{flex:none;width:96px;aspect-ratio:1!important}
.topic .ct{flex:1;padding:0!important}
.notice{display:flex;gap:10px;align-items:flex-start;margin:0 0 14px;padding:12px 14px;border-radius:12px;background:var(--paper);border:1px solid var(--line);font-size:14px}
.notice b{display:block;font-size:15px}
/* 결과 */
.rs{position:relative;background:var(--paper);border:1px solid var(--line);box-shadow:3px 3px 0 var(--line);padding:16px 14px 12px;margin-top:22px}
.rs h3{margin:0 0 4px;font:var(--hw) 23px/1.25 var(--fh)}
.rs h3 small{font:500 13px var(--fb);color:var(--muted);margin-left:4px}
.rs .tp{left:24px;transform:rotate(-6deg)}
.ri{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.ri:first-of-type{border-top:0}
.ri img{flex:none;width:64px;height:64px;border-radius:8px;object-fit:cover}
.ri b{display:block;font-size:16px}
.ri span{font-size:13px;color:var(--muted)}
.rs .none{margin:6px 0 2px;color:var(--muted);font-size:14px}
.rs .re{display:inline-block;margin-top:8px;font:700 13px var(--fb);color:var(--ac);border:1.5px solid var(--ac);border-radius:999px;padding:5px 12px;background:#fff}
</style>
</head>
<body>
<div class="stage"><main class="app" id="app"></main></div>
<dialog id="help" aria-labelledby="ht"><h2 id="ht">이렇게 골라요!</h2><ol><li>주제는 3개예요. 새집 물건, 건강한 생활, 필요한 도움.</li><li>주제마다 사진 8장 중에서 <b>최대 5개</b>까지 골라요.</li><li>다시 누르면 고른 것이 취소돼요. <b>다시 고르기</b>를 누르면 그 주제를 처음부터 골라요.</li><li>3개 주제를 다 고르면 나의 선택을 모아서 보여 줘요.</li></ol><p>정답은 없어요. 사람마다 필요한 것이 달라요.</p><button onclick="this.closest('dialog').close()">알겠어요</button></dialog>
<script src="../common/game.js"></script>
<script>
const BRAND={mark:'선',html:'나의 생활, <b>나의 선택</b>'};
const LIMIT=5;   // 요청서: 주제마다 최대 5개(프로토타입은 3·2·2개였음)
// 주제·질문 문구는 프로토타입 「중기 온라인 프로토타입/m1-1.html」, 사진은 실제 사진 8장씩.
// 라벨·설명은 프로토타입에 같은 항목이 있으면 그대로 썼다. 프로토타입에 없는 사진은 사진을 보고 붙였다(아래 '임시' 표시).
const TOPICS=[
  {key:'home',tab:'새집 물건',title:'새집에 먼저 필요한 것을 골라요',question:'나는 새집에 무엇이 먼저 필요할까요?',
   items:[
    ['table','식탁','식사하거나 간단한 일을 할 수 있어요.'],
    ['sofa','소파','편하게 쉬거나 손님을 맞이할 수 있어요.'],
    ['full-length-mirror','전신 거울','외출하기 전에 옷차림을 살필 수 있어요.'],
    ['wall-clock','벽시계','시간을 확인하고 약속을 지킬 수 있어요.'],
    ['bed','침대','편안히 쉬고 잠을 잘 수 있어요.'],
    ['refrigerator','냉장고','음식을 싱싱하게 보관할 수 있어요.'],          // 임시: 사진 보고 지은 설명
    ['washing-machine','세탁기','옷과 수건을 깨끗하게 빨 수 있어요.'],      // 임시: 사진 보고 지은 설명
    ['rice-cooker','전기밥솥','밥을 지어 따뜻하게 먹을 수 있어요.']          // 임시: 사진 보고 지은 설명
   ]},
  {key:'health',tab:'건강한 생활',title:'내가 실천할 건강한 습관을 골라요',question:'나는 내 몸을 위해 무엇을 해 볼까요?',
   items:[
    ['walking','20분 걷기','가볍게 몸을 움직일 수 있어요.'],
    ['sleeping','일찍 잠자리 들기','다음 날을 더 개운하게 시작할 수 있어요.'],
    ['water-and-vegetables','물과 채소 챙겨 먹기','하루 동안 물과 채소를 챙겨 먹을 수 있어요.'],  // 임시: 프로토타입 '물 자주 마시기'를 사진에 맞게 넓힘
    ['choose-less-sugary-snacks','단 간식 줄이기','달지 않은 과일 같은 간식을 고를 수 있어요.'],   // 임시
    ['regular-meal','제때 밥 먹기','하루 세끼를 정해진 시간에 먹을 수 있어요.'],                  // 임시
    ['stretching','스트레칭하기','몸을 천천히 풀어 줄 수 있어요.'],                                // 임시
    ['handwashing','손 씻기','병균을 막고 몸을 깨끗하게 할 수 있어요.'],                           // 임시
    ['brushing-teeth','이 닦기','이를 건강하게 지킬 수 있어요.']                                   // 임시
   ]},
  {key:'help',tab:'필요한 도움',title:'활동지원사와 배울 기술을 골라요',question:'나는 어떤 생활기술을 먼저 배울까요?',
   items:[
    ['doing-laundry','세탁기 돌리기','내 옷을 깨끗하게 관리할 수 있어요.'],
    ['using-microwave','전자레인지 사용하기','간단한 식사를 안전하게 준비할 수 있어요.'],
    ['washing-dishes','설거지하기','먹은 그릇을 깨끗하게 씻을 수 있어요.'],                        // 임시
    ['writing-a-note','메모하기','할 일과 약속을 잊지 않게 적을 수 있어요.'],                      // 임시
    ['sweeping-floor','바닥 청소하기','살고 있는 곳을 깨끗하게 유지할 수 있어요.'],                // 임시: 라벨은 사진 보고 지음
    ['grocery-shopping','장보기','필요한 물건을 골라 살 수 있어요.'],
    ['simple-cooking','간단한 요리하기','내가 먹을 음식을 직접 준비할 수 있어요.'],
    ['making-a-phone-call','전화 걸기','필요한 곳에 직접 연락할 수 있어요.']                     // 임시
   ]}
];
const img=(t,id)=>`img/${t.key}-${id}.jpg`;
const item=(t,id)=>t.items.find(x=>x[0]===id);

const root=document.getElementById('app');
let picks=[[],[],[]];
const quiet=()=>{try{speechSynthesis.cancel()}catch(e){}};

function home(){
  quiet();
  DK.mount(root,`${DK.hbar(BRAND)}
  <section class="hero"><span class="eb">My life, my choice</span><h1 class="h1">나의 생활,<br><em>나의 선택</em></h1>
  <p>생활에 필요한 것을 내가 직접 골라 봐요.<br>주제는 3개, 주제마다 <b>5개까지</b> 고를 수 있어요.</p></section>
  <div class="notice"><span aria-hidden="true">💬</span><div><b>사람마다 필요한 것이 달라요.</b>그래서 선택도 서로 다를 수 있어요. 정답은 없어요.</div></div>
  <div class="topics">${TOPICS.map((t,i)=>`<div class="photo topic ${i%2?'tilt-r':'tilt-l'}"><i class="tp"></i><span class="cp"><img src="${img(t,t.items[i===0?1:0][0])}" alt=""></span><span class="ct">${i+1}. ${t.tab}<small>${t.question}</small></span></div>`).join('')}</div>
  <div class="acts"><button class="btn pri" data-act="start">시작하기</button><button class="btn sec" data-say="나의 생활, 나의 선택. 주제마다 사진 여덟 장 중에서 다섯 개까지 골라요.">🔊 듣기</button></div>${DK.DKU}`,
  {start:()=>{picks=[[],[],[]];topic(0)}});
}

function topic(i,keepScroll){
  const t=TOPICS[i],mine=picks[i],full=mine.length>=LIMIT,last=i===TOPICS.length-1;
  const y=window.scrollY;
  DK.mount(root,`${DK.hbar(BRAND,true)}
  <nav class="tabs" aria-label="주제">${TOPICS.map((x,k)=>`<button class="${k===i?'on':''} ${picks[k].length?'done':''}" data-act="tab" data-k="${k}" aria-current="${k===i}"><b>${k+1}</b>${x.tab}<small>${picks[k].length?`✓ ${picks[k].length}개`:'아직'}</small></button>`).join('')}</nav>
  <div class="thead"><p class="q">${t.question}</p><p class="cnt" aria-live="polite"><b>${mine.length}</b><span> / ${LIMIT}</span><small>개 골랐어요</small></p></div>
  <p class="qs" style="display:flex;gap:8px;align-items:center">${t.title}. 5개까지 골라요. <button class="spk" data-say="${DK.esc(t.question+' '+LIMIT+'개까지 골라요.')}" aria-label="소리로 듣기">${DK.SPK}</button></p>
  <div class="picks eight">${t.items.map(([id,name])=>{const k=mine.indexOf(id);return `<button class="pick photo${k>=0?' on':''}" data-act="pick" data-id="${id}" aria-pressed="${k>=0}" aria-label="${name}${k>=0?', 골랐어요':''}" ${k<0&&full?'disabled':''}>${k>=0?`<i class="cn">✓</i>`:''}<span class="cp"><img src="${img(t,id)}" alt="${name}"></span><span class="ct">${name}</span></button>`}).join('')}</div>
  ${full?'<p class="full">5개를 다 골랐어요. 바꾸고 싶으면 고른 사진을 한 번 더 눌러요.</p>':''}
  <div class="acts two"><button class="btn sec" data-act="reset" ${mine.length?'':'disabled'}>↺ 다시 고르기</button><button class="btn pri" data-act="next" ${mine.length?'':'disabled'}>${last?'나의 선택 보기 ›':'다음 주제 ›'}</button></div>
  ${mine.length?'':'<p class="qs" style="text-align:center;margin:10px 0 0">1개 이상 고르면 다음으로 갈 수 있어요.</p>'}${DK.DKU}`,{
    home,
    tab:b=>topic(+b.dataset.k),
    pick:b=>{
      const id=b.dataset.id,k=mine.indexOf(id);
      if(k>=0)mine.splice(k,1);else if(mine.length<LIMIT){mine.push(id);DK.speak(item(t,id)[1])}
      topic(i,true);
    },
    reset:()=>{picks[i]=[];topic(i,true)},
    next:()=>{
      if(!last)topic(i+1);
      else{const empty=picks.findIndex(p=>!p.length);empty>=0?topic(empty):result()}
    }
  });
  if(keepScroll)window.scrollTo(0,y);
  else DK.speak(t.question);
}

function result(){
  quiet();
  const say='나의 선택이에요. '+TOPICS.map((t,i)=>`${t.tab}, ${picks[i].map(id=>item(t,id)[1]).join(', ')}.`).join(' ');
  DK.mount(root,`${DK.hbar(BRAND,true)}
  <section class="hero"><span class="eb">My choices</span><h1 class="h1">나의 선택을<br><em>모아 봤어요</em></h1><p>내가 고른 것을 살펴봐요. 다시 고르고 싶은 주제는 <b>다시 고르기</b>를 눌러요.</p></section>
  ${TOPICS.map((t,i)=>`<section class="rs"><i class="tp"></i><h3>${i+1}. ${t.tab}<small>${picks[i].length}개</small></h3>
    ${picks[i].length?picks[i].map(id=>{const [,n,d]=item(t,id);return `<div class="ri"><img src="${img(t,id)}" alt=""><div><b>${n}</b><span>${d}</span></div></div>`}).join(''):'<p class="none">아직 고르지 않았어요.</p>'}
    <button class="re" data-act="redo" data-k="${i}">↺ 이 주제 다시 고르기</button></section>`).join('')}
  <section class="note"><i class="tp"></i><h3>💡 이야기해 볼까요?</h3><p style="margin:0">나는 왜 이것을 골랐나요?<br>친구와 같은 점, 다른 점은 무엇인가요?</p></section>
  <div class="acts"><button class="btn line" data-act="listen">🔊 나의 선택 듣기</button><div class="acts two" style="margin:0"><button class="btn sec" data-act="home">‹ 처음으로</button><button class="btn pri" data-act="again">↻ 다시 하기</button></div></div>${DK.DKU}`,{
    home,listen:()=>DK.speak(say),
    redo:b=>{const k=+b.dataset.k;picks[k]=[];topic(k)},
    again:()=>{picks=[[],[],[]];topic(0)}
  });
  DK.done();
  DK.speak('나의 선택을 모아 봤어요.');
}

home();
</script>
</body>
</html>
