<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efdf">
<title>나의 스트레스 해소법 월드컵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=Gowun+Batang:wght@400;700&family=Gaegu:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/paper.css">
<style>
/* ===== 두 사진 대결 화면 — 1-1 「오늘의 PICK」 reels(gal 라벨 + scr 배지)를 옮겼다 ===== */
.vsv{display:flex;flex-direction:column;min-height:calc(100dvh - 40px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
.rrow{display:flex;align-items:center;gap:10px}
.rrow .seg{flex:1;margin:0}
.rbtn{flex:none;width:38px;height:38px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font:700 18px var(--fb);color:var(--ink)}
.rbtn[disabled]{opacity:.35}
.rqrow{display:flex;align-items:center;gap:10px;margin:12px 0 0}
.rq{flex:1;margin:0;font:var(--hw) 25px/1.25 var(--fh);letter-spacing:-.03em}
.rq small{display:block;font:500 13px var(--fb);color:var(--muted);letter-spacing:0;margin-top:2px}
.rq small b{color:var(--ac)}
.duel{position:relative;flex:1;display:flex;flex-direction:column;gap:12px;margin-top:12px;min-height:440px}
.half{position:relative;flex:1;min-height:210px;border-radius:10px;overflow:hidden;background:#222;box-shadow:0 6px 16px rgba(60,40,20,.16);transition:opacity .35s,filter .35s,box-shadow .2s}
.half img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.half::before{content:"";position:absolute;inset:38% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.72));z-index:1;pointer-events:none}
.half.off{opacity:.32;filter:grayscale(.7)}
.half.on{box-shadow:0 0 0 4px var(--ac),0 10px 22px rgba(60,40,20,.24)}
.half .nm{position:absolute;left:14px;right:78px;bottom:14px;z-index:2;color:#fff;font:var(--lw) 22px/1.3 var(--fl);letter-spacing:-.03em;text-shadow:0 1px 8px rgba(0,0,0,.55);text-align:left}
.half .rail{position:absolute;right:12px;bottom:12px;z-index:2;display:grid;gap:4px;justify-items:center;color:#fff;font:700 16px var(--fh);text-shadow:0 1px 4px rgba(0,0,0,.7)}
.half .rail b{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--paper);color:var(--ac);border:2px dashed var(--ac);transition:transform .25s,background .25s}
.half.a .nm{bottom:36px}
.half.a .rail{bottom:32px}
.half .rail svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.1;transition:fill .2s}
.half.on .rail b{transform:scale(1.14);background:var(--ac);color:#fff;border-color:transparent}
.half.on .rail svg{fill:#fff;stroke:#fff}
.vs{position:absolute;left:50%;top:50%;z-index:7;width:58px;height:58px;border-radius:50%;background:var(--ac);color:var(--on);font:700 22px var(--fh);display:grid;place-items:center;transform:translate(-50%,-50%) rotate(12deg);box-shadow:2px 3px 0 rgba(0,0,0,.2);pointer-events:none}
.pk{position:absolute;left:50%;top:46%;z-index:4;display:none;pointer-events:none;white-space:nowrap;color:#fff;font:700 40px var(--fh);border:4px solid var(--ac);border-radius:50%;padding:4px 26px 8px;background:rgba(0,0,0,.25);text-shadow:0 2px 6px rgba(0,0,0,.4);--pr:-8deg;transform:translate(-50%,-50%) rotate(var(--pr))}
.half.on .pk{display:block;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(var(--pr))}to{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(var(--pr))}}
.vsv .dku{margin:12px 0 0}
.vsv .dku img{width:84px}

.half .nm small{display:block;font:500 13px/1.4 var(--fb);opacity:.92;margin-top:2px}

/* ===== 결과: 순위표 ===== */
.win .stamp{font-size:22px}
.ranks{display:grid;gap:10px;margin-top:18px}
.rk{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:8px 12px 8px 8px;box-shadow:0 3px 10px rgba(60,40,20,.1)}
.rk .pi{flex:none;width:84px;aspect-ratio:4/3;border-radius:9px;overflow:hidden;background:var(--soft)}
.rk .pi img{width:100%;height:100%;object-fit:cover}
.rk .pt{flex:1;min-width:0}
.rk small{display:inline-block;font:700 13px var(--fb);color:var(--on);background:var(--ac);border-radius:999px;padding:1px 10px}
.rk b{display:block;font:var(--hw) 24px/1.2 var(--fh);margin-top:3px}
.rk.sm{padding:6px 12px 6px 6px}
.rk.sm .pi{width:58px}
.rk.sm small{background:var(--muted)}
.rk.sm b{font-size:20px}
.rk .pt span{display:block;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="stage"><main class="app" id="app"></main></div>
<dialog id="help" aria-labelledby="ht"><h2 id="ht">이렇게 골라요!</h2><ol><li>위·아래 사진 2장 중에서 <b>지금의 나에게 더 잘 맞는 방법</b>을 눌러요.</li><li>16강 → 8강 → 4강 → 결승, 모두 15번 골라요.</li><li>마지막에 <b>나만의 스트레스 해소법</b>이 나와요.</li></ol><p>정답은 없어요. ↶ 버튼으로 이전 선택으로 돌아갈 수 있어요. 마음이 바뀌면 다시 해도 괜찮아요.</p><button onclick="this.closest('dialog').close()">알겠어요</button></dialog>
<script src="../common/game.js"></script>
<script>
const BRAND={mark:'편',html:'스트레스 해소법 <b>월드컵</b>'};
// 해소법 16개 — 이름·설명은 프로토타입 「중기 온라인 프로토타입/m3-3.html」 그대로, 사진은 실제 사진 16장
// (09 bath 사진은 욕조·목욕 가운이라 이름을 '샤워하기' → '목욕·샤워하기'로 넓혔다. 04 puzzle 사진은 '좋아하는 취미 하기')
const ITEMS=[
  {id:'music',  n:'음악 듣기',             d:'좋아하는 음악을 들어요',  img:'img/listening-to-music.jpg'},
  {id:'rest',   n:'편하게 쉬기',           d:'잠깐 누워서 쉬어요',      img:'img/resting.jpg'},
  {id:'pet',    n:'반려동물 돌보기',       d:'동물과 함께 있어요',      img:'img/pet-care.jpg'},
  {id:'movie',  n:'TV·영화 보기',          d:'재미있는 것을 봐요',      img:'img/watching-movie.jpg'},
  {id:'board',  n:'보드게임 하기',         d:'함께 게임을 해요',        img:'img/board-game.jpg'},
  {id:'badm',   n:'배드민턴 하기',         d:'몸을 움직여요',           img:'img/badminton.jpg'},
  {id:'walk',   n:'산책하기',              d:'밖에서 천천히 걸어요',    img:'img/walking.jpg'},
  {id:'breath', n:'천천히 숨 쉬기',        d:'숨을 깊게 쉬어요',        img:'img/slow-breathing.jpg'},
  {id:'drink',  n:'따뜻한 음료 마시기',    d:'차나 물을 마셔요',        img:'img/warm-drink.jpg'},
  {id:'talk',   n:'믿을 사람과 이야기하기',d:'내 마음을 말해요',        img:'img/talk-with-trusted-person.jpg'},
  {id:'draw',   n:'글·그림으로 표현하기',  d:'마음을 적거나 그려요',    img:'img/writing-drawing.jpg'},
  {id:'bath',   n:'목욕·샤워하기',         d:'몸을 편안하게 해요',      img:'img/bath.jpg'},
  {id:'clean',  n:'정리·청소하기',         d:'내 주변을 정리해요',      img:'img/cleaning.jpg'},
  {id:'cook',   n:'간단한 요리하기',       d:'좋아하는 것을 만들어요',  img:'img/simple-cooking.jpg'},
  {id:'stretch',n:'스트레칭하기',          d:'몸을 천천히 풀어요',      img:'img/stretching.jpg'},
  {id:'hobby',  n:'좋아하는 취미 하기',    d:'내가 좋아하는 일을 해요', img:'img/puzzle.jpg'}
];
const ROUND_NAMES={16:'16강',8:'8강',4:'4강',2:'결승'};
const TOTAL=15;   // 8 + 4 + 2 + 1
const Q='지금의 나에게 더 잘 맞는 방법은?';
const HEART='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.3s-7.4-4.4-9.2-8.9C1.5 8 3.6 4.6 7.1 4.6c2 0 3.4 1 4.9 2.8 1.5-1.8 2.9-2.8 4.9-2.8 3.5 0 5.6 3.4 4.3 6.8-1.8 4.5-9.2 8.9-9.2 8.9z"/></svg>';
const byId=id=>ITEMS.find(c=>c.id===id);

const root=document.getElementById('app');
let G=null,hist=[],timer=null;
const quiet=()=>{try{speechSynthesis.cancel()}catch(e){}};
const snap=()=>JSON.parse(JSON.stringify(G));
const pairUp=ids=>{const p=[];for(let i=0;i<ids.length;i+=2)p.push([ids[i],ids[i+1]]);return p};

function newGame(){G={round:16,matchNo:0,pairs:pairUp(DK.shuffle(ITEMS.map(c=>c.id))),idx:0,winners:[],semi:[],final:null,champion:null};hist=[]}
/* 다음 대결로. 한 라운드가 끝나면 이긴 것끼리 다시 섞어 짝 짓는다 */
function advance(){
  G.idx++;
  if(G.idx<G.pairs.length)return;
  if(G.round===2){G.champion=G.winners[0];return}
  G.round/=2;G.idx=0;
  G.pairs=pairUp(DK.shuffle(G.winners));G.winners=[];
  if(G.round===4)G.semi=G.pairs.flat();     // 4강에 오른 4개
  if(G.round===2)G.final=G.pairs[0];        // 결승에 오른 2개
}

function home(){
  quiet();clearTimeout(timer);
  DK.mount(root,`${DK.hbar(BRAND)}
  <section class="hero"><span class="eb">Stress relief world cup</span><h1 class="h1">나의 스트레스<br><em>해소법 월드컵</em></h1>
  <p>두 가지 방법 중 <b>지금의 나에게 더 잘 맞는 것</b>을 골라요.<br>정답은 없어요. 내 마음이 편해지는 방법을 찾아봐요.</p></section>
  <div class="photo tilt-l"><i class="tp"></i><span class="cp"><img src="img/listening-to-music.jpg" alt="헤드폰으로 음악을 들으며 쉬는 모습" style="object-position:50% 35%"></span><span class="ct">해소법 16가지<small>16강 → 8강 → 4강 → 결승, 모두 15번 골라요</small></span></div>
  <section class="note"><i class="tp"></i><h3>이렇게 해요</h3><ol><li>마음에 드는 방법을 하나 눌러요.</li><li>모두 고르면 나만의 방법이 나와요.</li><li>마음이 바뀌면 다시 해도 괜찮아요.</li></ol></section>
  <div class="acts"><button class="btn pri" data-act="start">16강 시작하기</button></div>${DK.DKU}`,{start:()=>{newGame();match()}});
}

function match(){
  const pair=G.pairs[G.idx].map(byId);
  const say=`${Q} ${pair[0].n}. 아니면, ${pair[1].n}.`;
  const inRound=G.pairs.length;
  DK.mount(root,`<div class="vsv">
  <div class="rtop"><div class="rrow"><button class="rbtn" data-act="home" aria-label="처음으로">‹</button>${DK.seg(TOTAL,G.matchNo)}<button class="rbtn" data-act="undo" aria-label="이전 선택으로" ${hist.length?'':'disabled'}>↶</button></div>
  <div class="rqrow"><p class="rq">${Q}<small><b>${ROUND_NAMES[G.round]}</b>${inRound>1?` ${G.idx+1} / ${inRound}`:''} · 모두 ${G.matchNo+1} / ${TOTAL}번째</small></p><button class="spk" data-say="${DK.esc(say)}" aria-label="소리로 듣기">${DK.SPK}</button></div></div>
  <div class="duel">${pair.map((c,i)=>`<button class="half ${i?'b':'a'}" data-act="pick" data-i="${i}" aria-label="${DK.esc(c.n)} 고르기"><img src="${c.img}" alt=""><span class="nm">${DK.esc(c.n)}<small>${DK.esc(c.d)}</small></span><span class="rail"><b>${HEART}</b><span>이게 좋아</span></span><span class="pk">이거!</span></button>`).join('')}
  <span class="vs" aria-hidden="true">VS</span></div>${DK.DKU}</div>`,{
    home,
    undo:()=>{if(!hist.length||G.locked)return;clearTimeout(timer);G=hist.pop();match()},
    pick:b=>{
      if(G.locked)return;G.locked=true;
      const i=+b.dataset.i;
      root.querySelectorAll('.half').forEach((h,j)=>h.classList.add(j===i?'on':'off'));
      root.querySelectorAll('[data-act=undo]').forEach(u=>u.disabled=true);
      timer=setTimeout(()=>{
        const before=snap();before.locked=false;hist.push(before);
        G.winners.push(G.pairs[G.idx][i]);G.matchNo++;
        advance();G.locked=false;quiet();
        G.champion?result():match();
      },matchMedia('(prefers-reduced-motion: reduce)').matches?150:700);
    }
  });
}

function result(){
  quiet();
  const c=byId(G.champion);
  const second=byId(G.final.find(id=>id!==G.champion));
  const four=G.semi.filter(id=>!G.final.includes(id)).map(byId);
  const line=`나만의 스트레스 해소법은 ${c.n}${DK.ieyo(c.n)}.`;
  const all=`${line} 결승까지 간 방법은 ${second.n}. 4강에 오른 방법은 ${four.map(x=>x.n).join(', ')}.`;
  DK.mount(root,`${DK.hbar(BRAND,true)}
  <section class="hero"><span class="eb">My stress relief</span><h1 class="h1">나만의<br><em>스트레스 해소법</em></h1><p>15번 골라서 찾았어요.</p></section>
  <article class="win"><span class="stamp">우승</span><span class="wp"><img src="${c.img}" alt="${DK.esc(c.n)}" style="object-position:50% 40%"></span><div class="wc"><h2>${DK.esc(c.n)}</h2><p>${DK.esc(c.d)}</p></div></article>
  ${DK.sayBig(`${c.d}. 이 방법으로 내 마음을 조금 편하게 해 볼까요?`)}
  <p class="sl" style="margin:20px 0 0">끝까지 올라온 방법</p>
  <div class="ranks" style="margin-top:10px">
    <div class="rk"><span class="pi"><img src="${second.img}" alt=""></span><span class="pt"><small>결승</small><b>${DK.esc(second.n)}</b><span>${DK.esc(second.d)}</span></span></div>
    ${four.map(x=>`<div class="rk sm"><span class="pi"><img src="${x.img}" alt=""></span><span class="pt"><small>4강</small><b>${DK.esc(x.n)}</b></span></div>`).join('')}
  </div>
  <section class="note"><i class="tp"></i><h3>기억해요</h3><p style="margin:0">이 방법이 언제나 꼭 맞아야 하는 것은 아니에요. 오늘의 내 마음에 맞는 방법을 골라 보세요.<br>혼자 고르기 어렵다면 믿을 수 있는 사람과 함께 해도 좋아요.</p></section>
  <div class="acts"><button class="btn line" data-act="listen">🔊 결과 다 듣기</button><div class="acts two" style="margin:0"><button class="btn sec" data-act="home">‹ 처음으로</button><button class="btn pri" data-act="again">↻ 다시 해 보기</button></div></div>${DK.DKU}`,{
    home,listen:()=>DK.speak(all),again:()=>{newGame();match()}
  });
  DK.done({champion:c.n});
  DK.speak(line);
}

home();
</script>
</body>
</html>
