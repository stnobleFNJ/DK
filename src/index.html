<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>생애주기 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=Gaegu:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 디자인 기준: data/dk/typeA.html (종이 전시) */
:root{--bg:#f4efdf;--paper:#fffaf0;--ink:#453f36;--muted:#807669;--line:#d8c9b3;--ac:#b9543c;--on:#fff;--soft:#e9dfca;--tape:#f1c96b;--tx:rgba(170,167,147,.18);
 --fb:"Noto Sans KR",system-ui,sans-serif;--fh:"Gaegu","Noto Sans KR",cursive;--fm:"Space Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);background-image:repeating-linear-gradient(0deg,transparent 0 27px,var(--tx) 27px 28px);color:var(--ink);font-family:var(--fb);line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:28px 16px 72px}
.eb{display:block;font:700 12px var(--fm);letter-spacing:.2em;color:var(--ac);text-transform:uppercase}
h1{margin:6px 0 0;font:700 clamp(34px,6vw,48px)/1.2 var(--fh);letter-spacing:-.03em}
h1 em{font-style:normal;color:var(--ac)}
.sec{margin:44px 0 0;display:flex;align-items:baseline;gap:10px;font:700 26px/1.2 var(--fh);letter-spacing:-.02em}
.sec:first-of-type{margin-top:28px}
.sec span{font:700 12px var(--fm);letter-spacing:.16em;color:var(--muted)}
.grid{list-style:none;margin:22px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 16px}
.card{position:relative;display:flex;flex-direction:column;gap:4px;height:100%;min-height:132px;padding:18px 14px 14px;color:inherit;text-decoration:none}
.code{font:700 13px var(--fm);letter-spacing:.08em;color:var(--ac)}
.name{font:700 22px/1.25 var(--fh);letter-spacing:-.02em}
.name small{display:block;margin-top:2px;font:500 14px/1.4 var(--fb);color:var(--muted);letter-spacing:0}
.name b{font-family:var(--fb);font-size:17px;font-weight:900;color:var(--muted)}
/* 완성된 게임: 스크랩북 카드 */
a.card{background:#fff;box-shadow:0 6px 14px rgba(60,40,20,.18);transform:rotate(-1.5deg);transition:transform .2s,box-shadow .2s}
.grid li:nth-child(even) a.card{transform:rotate(1.5deg)}
a.card::before{content:"";position:absolute;top:-9px;left:50%;width:58px;height:18px;transform:translateX(-50%) rotate(-4deg);background:var(--tape);opacity:.88}
a.card .go{margin-top:auto;align-self:flex-start;background:var(--ac);color:var(--on);font-weight:700;font-size:14px;border-radius:999px;padding:6px 14px}
a.card:hover,a.card:focus-visible{transform:rotate(0) translateY(-3px);box-shadow:0 12px 24px rgba(60,40,20,.22);outline:none}
a.card:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
a.card:active{transform:scale(.97)}
/* 개발 전: 빈 종이 */
.img{margin-top:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.img .bd{flex:none;font-weight:700;border-radius:999px;padding:1px 10px;border:1.5px solid currentColor}
/* 있음=초록 칠, 일부=노랑 칠(테이프 색), 없음=빨강 테두리만 */
.img .bd.ok{color:#fff;background:#4f7a3a;border-color:#4f7a3a}
.img .bd.part{color:#5a3f08;background:var(--tape);border-color:#d9a93f}
.img .bd.none{color:var(--ac);background:transparent}
.img .bd.na{color:var(--muted);border-style:dashed}
/* 11/02 자료로 새로 추가·변경된 게임 */
.new{position:absolute;top:10px;right:10px;font:700 11px var(--fm);letter-spacing:.08em;color:#fff;background:var(--ac);border-radius:4px;padding:1px 6px;transform:rotate(4deg)}
.img .bd.tbd{color:var(--muted);font-weight:900}
.img small{font-size:12px;line-height:1.4;flex-basis:100%}
a.card .img{margin-top:6px}
div.card{background:var(--paper);border:1.5px dashed var(--line)}
div.card .code{color:var(--muted)}
/* QR: 교재(교재_생애주기_전기.pdf)의 둥근 QR 상자 모양. 과정 색 = 교재 표지 색(전기 주황·중기 초록·후기 보라) */
.grid li{position:relative}
a.card.has-qr .img,a.card.has-qr .go{margin-right:78px}
.qr{position:absolute;right:12px;bottom:12px;z-index:2;width:66px;padding:5px 5px 3px;border:2.5px solid var(--qc,#453f36);border-radius:12px;background:#fff;cursor:pointer;font:700 9px/1.2 var(--fb);color:var(--qc,#453f36);text-align:center;transform:rotate(-1.5deg);transition:transform .2s,box-shadow .2s}
.grid li:nth-child(even) .qr{transform:rotate(1.5deg)}
.qr svg{display:block;width:100%;height:auto}
.qr span{display:block;margin-top:2px;letter-spacing:-.02em}
.qr:hover,.qr:focus-visible{transform:rotate(0) scale(1.06);box-shadow:0 6px 14px rgba(60,40,20,.25);outline:none}
.qr:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.sec-early{--qc:#f07c54}.sec-middle{--qc:#3da27c}.sec-late{--qc:#8e5aa8}
a.card .go{white-space:nowrap}
@media (max-width:639px){a.card.has-qr .go{margin-right:56px;font-size:13px;padding:6px 10px}a.card.has-qr .img{margin-right:56px}.qr{width:50px;right:10px;padding:4px 4px 2px;border-width:2px;border-radius:10px}.qr span{font-size:8px}}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px){.wrap{padding:44px 32px 88px}.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:30px 20px}}
@media (prefers-reduced-motion:reduce){a.card{transition:none}}
</style>
</head>

 {code:'중6-2',name:'내가 살고 싶은 집 (주거 이상형 월드컵)',href:'games/m6-2/index.html',img:'ok'},

 {code:'중7-1',name:'우리집 위험 요소 찾기',href:'games/m7-1/index.html',img:'part',imgNote:'안전해진 모습 스티커 임시 그림'},
 {code:'중7-2',name:'위험한 연락 구분하기',href:'games/m7-2/index.html',img:'na'},
 {code:'중7-3',name:'옆집 아주머니 이야기',href:'games/m7-3/index.html',img:'ok',isNew:1},
 {code:'중7-4',name:'이건 학대일까요?',href:'games/m7-4/index.html',img:'ok'},
 {code:'중8-2',name:'나의 건강계산기 (체질량지수 확인하기)',href:'games/m8-2/index.html',img:'ok',isNew:1},
 {code:'중8-3',name:'생활 뉴스: 참지 마세요 (내 몸의 이상 신호 말해보기)',href:'games/m8-3/index.html',img:'ok',isNew:1}
];
const LATE=[
 {code:'후3-1',name:'나에게 맞는 도움 고르기',href:'games/h3-1/index.html',img:'ok',isNew:1},
 {code:'후4-1',name:'위급 신호 몸으로 따라 하기',href:'games/h4-1/index.html',img:'part',imgNote:'단계 동작 사진 16장 + 두통 사진 임시 그림',isNew:1},
 {code:'후4-3',name:'휴대전화로 119 신고하기',href:'games/h4-3/index.html',img:'ok',isNew:1},
 {code:'후5-2',name:'나의 추억 카드 만들기',href:'games/h5-2/index.html',img:'ok',isNew:1}
];
const SECTIONS=[['성인 전기','EARLY',EARLY],['성인 중기','MIDDLE',MIDDLE],['성인 후기','LATE',LATE]];
// ── QR 코드: 내용은 「시작하기」를 눌렀을 때 들어가는 주소. 누르면 교재용 PNG로 저장 ──
const PROD='https://dnefit.mycafe24.com/dk/';  // 내 PC(로컬)에서 열었을 때는 실제 서버 주소로 만든다
const LOCAL=location.protocol==='file:'||/^(localhost|127\.|10\.|192\.168\.|\[?::1)/.test(location.hostname);
const COURSE={'성인 전기':'#f07c54','성인 중기':'#3da27c','성인 후기':'#8e5aa8'};
function gameUrl(href){return new URL(href,LOCAL?PROD:location.href).href}
function makeQR(url){const q=qrcode(0,'H');q.addData(url);q.make();return q}  // H: 가운데 로고가 가려도 읽힘
// 꾸민 QR(SVG): 둥근 점 + 과정 색 눈 + 가운데 「오늘의 게임」 로고. text=false면 로고 글자는 빼고 그림만(캔버스에서 글자를 따로 씀)
let LOGO=.22;  // 가운데 로고 크기(QR 폭 비율). 크면 판독이 어려워진다
function shade(h,k){const v=parseInt(h.slice(1),16);return'#'+[16,8,0].map(t=>Math.round((v>>t&255)*k).toString(16).padStart(2,'0')).join('')}
function qrArt(q,color,text){
 const n=q.getModuleCount(),Q=2,V=n+Q*2,ink='#2b2420',deep=shade(color,.62);  // 눈은 과정 색을 진하게(판독 대비)
 let L=Math.round(n*LOGO);if((n-L)%2)L++;const lo=(n-L)/2,hi=lo+L;           // 로고 칸(모듈 단위)
 const eye=(r,c)=>(r<8&&c<8)||(r<8&&c>=n-8)||(r>=n-8&&c<8),inLogo=(r,c)=>r>=lo-.5&&r<hi+.5&&c>=lo-.5&&c<hi+.5;
 let dots='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c)&&!eye(r,c)&&!inLogo(r,c))dots+=`<circle cx="${c+.5}" cy="${r+.5}" r=".43"/>`;
 const eyes=[[0,0],[0,n-7],[n-7,0]].map(([r,c])=>`<rect x="${c}" y="${r}" width="7" height="7" rx="1.1" fill="${deep}"/><rect x="${c+1}" y="${r+1}" width="5" height="5" rx=".75" fill="#fff"/><rect x="${c+2}" y="${r+2}" width="3" height="3" rx=".5" fill="${ink}"/>`).join('');
 const logo=`<rect x="${lo-.3}" y="${lo-.3}" width="${L+.6}" height="${L+.6}" rx="${L*.24}" fill="#fff"/><rect x="${lo+.35}" y="${lo+.35}" width="${L-.7}" height="${L-.7}" rx="${L*.2}" fill="#fff" stroke="${color}" stroke-width=".55"/>`
  +(text?`<text x="${n/2}" y="${n/2-L*.06}" text-anchor="middle" font-family="Gaegu,'Noto Sans KR',sans-serif" font-weight="700" font-size="${L*.26}" fill="${deep}">오늘의</text><text x="${n/2}" y="${n/2+L*.3}" text-anchor="middle" font-family="Gaegu,'Noto Sans KR',sans-serif" font-weight="700" font-size="${L*.4}" fill="${deep}">게임</text>`:'');
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-Q} ${-Q} ${V} ${V}" aria-hidden="true"><rect x="${-Q}" y="${-Q}" width="${V}" height="${V}" fill="#fff"/><g fill="${ink}">${dots}</g>${eyes}${logo}</svg>`;
}
function qrButton(g,course){
 const url=gameUrl(g.href),b=document.createElement('button');
 b.type='button';b.className='qr';b.title='QR 코드 이미지 저장 · '+url;
 b.setAttribute('aria-label',g.code+' '+(g.name||'')+' QR 코드 이미지로 저장');
 b.innerHTML=qrArt(makeQR(url),COURSE[course]||'#453f36',true)+'<span>QR 저장</span>';
 b.onclick=()=>saveQR(g,url,COURSE[course]||'#453f36');
 return b;
}
function wrapText(x,t,max){const out=[];let line='';for(const w of t.split(' ')){const tryL=line?line+' '+w:w;if(x.measureText(tryL).width>max&&line){out.push(line);line=w}else line=tryL}if(line)out.push(line);
 return out.flatMap(l=>{if(x.measureText(l).width<=max)return[l];const r=[];let cur='';for(const ch of l){if(x.measureText(cur+ch).width>max){r.push(cur);cur=ch}else cur+=ch}return r.concat(cur)})}
async function saveQR(g,url,color){
 try{await Promise.all([document.fonts.load('700 34px "Noto Sans KR"'),document.fonts.load('700 40px Gaegu','오늘의 게임')])}catch(e){}
 const q=makeQR(url),n=q.getModuleCount(),W=640,pad=56,qs=W-pad*2,cell=qs/(n+4);
 const m=g.name&&g.name.match(/^(.*\S)\s+(\([^()]*\))$/),title=m?m[1]:(g.name||g.code),sub=m?m[2]:'';
 const c=document.createElement('canvas'),x=c.getContext('2d');
 x.font='700 34px "Noto Sans KR",sans-serif';const lines=wrapText(x,title,W-pad*2).slice(0,3);
 const H=pad+qs+28+36+lines.length*46+(sub?36:0)+pad-8;
 c.width=W;c.height=H;
 // 둥근 상자(과정 색 테두리) + 흰 바탕
 const bw=10,rr=56;x.beginPath();x.roundRect(bw/2,bw/2,W-bw,H-bw,rr);x.fillStyle='#fff';x.fill();x.lineWidth=bw;x.strokeStyle=color;x.stroke();
 // 꾸민 QR: SVG 그림을 캔버스에 그리고, 가운데 로고 글자는 웹글꼴로 직접 쓴다
 const art=await new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(qrArt(q,color,false))});
 x.imageSmoothingEnabled=true;x.drawImage(art,pad,pad,qs,qs);
 {let L=Math.round(n*LOGO);if((n-L)%2)L++;const u=qs/(n+4),cx=pad+qs/2,cy=pad+qs/2;x.fillStyle=shade(color,.62);x.textAlign='center';x.textBaseline='alphabetic';
  x.font=`700 ${L*u*.26}px Gaegu,"Noto Sans KR",sans-serif`;x.fillText('오늘의',cx,cy-L*u*.06);
  x.font=`700 ${L*u*.4}px Gaegu,"Noto Sans KR",sans-serif`;x.fillText('게임',cx,cy+L*u*.3);}
 // 차시 표시 + 게임 이름(교재처럼 QR 아래 가운데)
 let y=pad+qs+28;x.textAlign='center';x.textBaseline='top';
 const code=g.code;x.font='700 24px "Noto Sans KR",sans-serif';const cw=x.measureText(code).width+32;
 x.beginPath();x.roundRect((W-cw)/2,y,cw,36,18);x.fillStyle=color;x.fill();x.fillStyle='#fff';x.fillText(code,W/2,y+3);y+=36+12;
 x.font='700 34px "Noto Sans KR",sans-serif';x.fillStyle='#222';lines.forEach(l=>{x.fillText(l,W/2,y);y+=46});

}
const IMG={ok:'있음',part:'일부',none:'없음',na:'필요 없음'};
const root=document.getElementById('games');
SECTIONS.forEach(([title,en,games])=>{const course=title;
const h=document.createElement('h2');h.className='sec';h.textContent=title;
const e=document.createElement('span');e.textContent=en+' · '+games.length;h.append(e);
const list=document.createElement('ul');list.className='grid sec-'+en.toLowerCase();
root.append(h,list);
games.forEach(g=>{
 const li=document.createElement('li');
 const el=document.createElement(g.href?'a':'div');
 el.className='card';
 if(g.href){el.href=g.href;el.target='_blank';el.rel='noopener'}
 const code=document.createElement('span');
 code.className='code';code.textContent=g.code;
 const n=document.createElement('span');
 n.className='name';
 if(g.name){
  // '이름 (설명)'은 괄호 부분을 다음 줄로 내린다
  const m=g.name.match(/^(.*\S)\s+(\([^()]*\))$/);
  n.textContent=m?m[1]:g.name;
  if(m){const s=document.createElement('small');s.textContent=m[2];n.append(s)}
 }
 else{const b=document.createElement('b');b.textContent='미정';n.append(b)}
 el.append(code,n);
 if(g.isNew){const t=document.createElement('span');t.className='new';t.textContent=g.isNew===2?'UPDATE':'NEW';el.append(t)}
 const img=document.createElement('span');
 img.className='img';
 const bd=document.createElement('span');
 bd.className='bd '+(IMG[g.img]?g.img:'tbd');
 bd.textContent=IMG[g.img]||'미정';
 img.append('이미지',bd);
 if(g.imgNote){const s=document.createElement('small');s.textContent=g.imgNote;img.append(s)}
 el.append(img);
 if(g.href){const go=document.createElement('span');go.className='go';go.textContent='시작하기 →';el.append(go)}
 li.append(el);
 if(g.href&&window.qrcode){el.classList.add('has-qr');li.append(qrButton(g,course))}
 list.append(li);
});
});
</script>
